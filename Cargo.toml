[workspace]
resolver = "2"
members = [
    "platform-common",
    "platform-common-api",
    "sentinel-proto",
    "sentinel-core",
    "sentinel-api",
    "sentinel-gateway",
    "sentinel-worker",
    "sentinel-bot",
    "nexus-proto",
    "nexus-core",
    "nexus-api",
    "nexus-gateway",
    "nexus-worker",
    "nexus-bot",
    "atrium-api",
    "atrium-core",
    "atrium-proto",
    "atrium-bot",
    "atrium-worker", "platform-common-bot", "platform-common-worker",
    "ops-core",
    "ops-api",
    "ops-worker",
    # Identite : OAuth2 Discord, sessions web, gate superadmin. Extraite de
    # sentinel-api pour que les trois plateformes la consomment a egalite.
    "auth-core",
    "auth-api",
    # Agent Docker : seul crate a parler au socket de l'hote.
    "docker-agent",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

# ── Dependencies partagées par tous les crates ──
#
# Les crates membres doivent maintenant déclarer :
#   tokio = { workspace = true }
#   serde = { workspace = true }
#   ...
#
# Les deps spécifiques (jemalloc target-gated, ort, sqlx, dioxus, etc.)
# restent inline dans chaque Cargo.toml de crate.
[workspace.dependencies]
# Async / runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
async-trait = "0.1"
futures-util = "0.3"
bollard = "0.18"
tar = "0.4"
ndarray = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

# Sérialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.13"

# Observabilité
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utils communs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
dashmap = "6"
dotenvy = "0.15"
rand = "0.8"

# HTTP / réseau
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# gRPC (Phase 7A)
tonic = { version = "0.13", features = ["transport", "codegen", "prost", "gzip", "server", "router", "tls-ring", "tls-native-roots"] }

# Discord
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "cache", "rustls_backend"] }

# Redis
redis = { version = "0.27", features = ["tokio-comp", "aio", "streams"] }

# Postgres (sqlx) — features maximales unionees entre tous les crates :
# runtime-tokio + tls-rustls + postgres + uuid + chrono + json. Cargo unifie
# de toute facon les features sur le workspace, donc declarer le superset
# n'ajoute pas de cout binaire.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }

# Internes (paths)
sentinel-proto = { path = "sentinel-proto" }
ops-core = { path = "ops-core" }
ops-api = { path = "ops-api" }
auth-core = { path = "auth-core" }
auth-api = { path = "auth-api" }
sentinel-core = { path = "sentinel-core" }
# Socle partage par les deux plateformes. `platform-common` n'a aucune
# dependance framework (Redis pur) ; `platform-common-api` tire axum/tower-http
# et n'est donc consomme que par les APIs, jamais par les bots.
platform-common = { path = "platform-common" }
platform-common-api = { path = "platform-common-api" }
atrium-core = { path = "atrium-core" }
atrium-proto = { path = "atrium-proto" }

# ── Lints partagés (à activer dans chaque crate via `[lints] workspace = true`) ──
[workspace.lints.clippy]
too_many_arguments = "allow"
result_large_err = "allow"
doc_lazy_continuation = "allow"
empty_line_after_doc_comments = "allow"
type_complexity = "allow"
should_implement_trait = "allow"
const_is_empty = "allow"

# ── Profil release partagé ──
# lto = "thin" + codegen-units = 16 : compilation ~40-60% plus rapide
# que fat LTO / codegen-units = 1, pour une perte runtime < 5% sur charge
# I/O-bound typique de nos bots/workers/api. Le link final API passe de
# plusieurs minutes à quelques dizaines de secondes.
[profile.release]
lto = "thin"
codegen-units = 16
strip = true
# panic = "unwind" (défaut) pour isoler les paniques par task tokio
