[package]
name = "atrium-api"
version.workspace = true
edition.workspace = true
description = "API d'accueil IA pour le bot Discord Atrium"

[[bin]]
name = "atrium-api"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
async-trait = { workspace = true }
platform-common-api = { workspace = true }
# Comparaison constant-time du jeton gRPC (cf. `grpc::serve`).
subtle = "2"
atrium-core = { workspace = true }
atrium-proto = { workspace = true }
tonic = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# Client HTTP reel : le test de non-regression du service doit passer par une
# socket, pas par `oneshot`, sinon il ne voit pas ce que fait `main`.
reqwest = { workspace = true }

[lints]
workspace = true
