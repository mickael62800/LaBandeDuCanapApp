# Plateforme Nexus — composant permanent de la plateforme unifiee.
x-nexus-default-logging: &nexus-default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-nexus-rust-base: &nexus-rust-base
  restart: unless-stopped
  init: true
  logging: *nexus-default-logging

x-nexus-build-alpine: &nexus-build-alpine
  context: ../..
  dockerfile: infrastructure/docker/Dockerfile.rust-alpine

services:

  # Redis DEDIE a la plateforme jeux.
  #
  # Nexus est le seul des trois a pouvoir etre separe proprement : ses deux
  # usages sont internes — la stream `nexus:events` (nexus-api publie,
  # nexus-bot consomme) et l'allocation atomique des ports de jeu. Atrium, lui,
  # CONSOMME `sentinel:events` (les demandes d'apaisement publiees par l'AutoMod
  # de Sentinel) : le separer lui imposerait deux connexions Redis pour une
  # cle de cooldown sans valeur. Il reste donc sur l'instance commune.
  #
  # Deux reglages different du Redis commun, et ce sont des CORRECTIONS :
  #
  #   - `noeviction` au lieu de `allkeys-lru`. Les reservations de port
  #     (`game:port:*`, TTL 7 j) sont le garde-fou anti-collision : sous LRU,
  #     Redis peut en evincer une encore active, et deux serveurs de jeu se
  #     voient alors attribuer le meme port. Le symptome apparait au demarrage
  #     du second, tres loin de la cause.
  #   - Persistance activee (`appendonly`). Un redemarrage de l'instance
  #     commune perdait ces reservations, avec le meme risque.
  nexus-redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    logging: *nexus-default-logging
    command: >-
      redis-server
      --requirepass ${NEXUS_REDIS_PASSWORD:?NEXUS_REDIS_PASSWORD est requis}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
    # PAS de `ports:` : joignable seulement par nexus-api et nexus-bot.
    volumes:
      - nexus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${NEXUS_REDIS_PASSWORD:?NEXUS_REDIS_PASSWORD est requis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # One-shot : cree le ROLE `nexus` et la base `nexus` qu'il possede
  # (idempotent, rejouable sur une installation existante).
  #
  # SECURITE — pourquoi un role dedie. `POSTGRES_USER: sentinel` est le
  # superuser du cluster : un superuser IGNORE tous les GRANT. Tant que
  # nexus-api se connectait avec ce compte, la separation en trois bases
  # logiques etait purement decorative — ses identifiants ouvraient
  # discord_sentinel et atrium. Le role `nexus` est un role ordinaire : il ne
  # possede que sa base, et les GRANT s'appliquent vraiment a lui.
  #
  # La reciproque n'est PAS fermee : sentinel-api et atrium-api se connectent
  # encore en superuser et peuvent donc lire la base nexus. Les basculer
  # demande de traiter leurs `CREATE EXTENSION` (pgvector cote Atrium n'est pas
  # une extension « trusted », elle exige le superuser) — chantier distinct.
  nexus-db-init:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}
      NEXUS_DB_PASSWORD: ${NEXUS_DB_PASSWORD:?NEXUS_DB_PASSWORD est requis}
    volumes:
      - ./scripts:/init:ro
    entrypoint:
      - sh
      - -euc
      - |
        PSQL="psql -h postgres -U sentinel -d discord_sentinel -v ON_ERROR_STOP=1"

        # 1. Role dedie. `ALTER` inconditionnel ensuite : une rotation de
        #    NEXUS_DB_PASSWORD dans le .env doit prendre effet au redemarrage,
        #    sinon l'API se retrouve avec un mot de passe que la base ignore.
        $$PSQL -tc "SELECT 1 FROM pg_roles WHERE rolname = 'nexus'" | grep -q 1 ||
          $$PSQL -c "CREATE ROLE nexus LOGIN"
        $$PSQL -c "ALTER ROLE nexus WITH LOGIN PASSWORD '$$NEXUS_DB_PASSWORD'"

        # 2. Base possedee par ce role. CREATE DATABASE ne peut pas tourner
        #    dans un bloc transactionnel -> commande separee.
        $$PSQL -tc "SELECT 1 FROM pg_database WHERE datname = 'nexus'" | grep -q 1 ||
          $$PSQL -c "CREATE DATABASE nexus OWNER nexus"

        # 3. Reprise d'une installation ou la base existait deja, creee par
        #    `sentinel`. Seuls les objets applicatifs de public sont repris ;
        #    les objets appartenant a une extension sont exclus.
        $$PSQL -c "ALTER DATABASE nexus OWNER TO nexus"
        psql -h postgres -U sentinel -d nexus -v ON_ERROR_STOP=1 \
          -v target_role=nexus \
          -f /init/reassign-public-objects.sql \
          -c "ALTER SCHEMA public OWNER TO nexus"

        # 4. Fermeture croisee. Par defaut PostgreSQL accorde CONNECT a PUBLIC
        #    sur toute base : sans ce REVOKE, le role `nexus` pourrait ouvrir
        #    une session sur discord_sentinel. Il n'y lirait rien (aucune table
        #    n'est accordee a PUBLIC), mais une session ouverte est deja une
        #    surface. Le proprietaire et les superusers ne sont pas concernes.
        $$PSQL -c "REVOKE CONNECT ON DATABASE discord_sentinel FROM PUBLIC" || true
        $$PSQL -c "GRANT CONNECT ON DATABASE nexus TO nexus"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data

  # Pool dedie, symetrique d'atrium-pgbouncer : nexus-api reste sur le reseau
  # interne et ne joint jamais PostgreSQL directement. Avant, il etait bi-network
  # (data + internal) faute de pool pour la base `nexus` — ce qui contredisait
  # l'invariant documente en bas de ce fichier (« seul pgbouncer est
  # bi-network ») et donnait a l'API des jeux une route directe vers l'instance
  # qui heberge aussi discord_sentinel.
  nexus-pgbouncer:
    image: edoburu/pgbouncer:latest@sha256:4c1ca296ef525f108f5d3552cc337c0c09587cf8dae7f0067fd93349e47dc1cd
    restart: unless-stopped
    logging: *nexus-default-logging
    environment:
      DATABASE_URL: postgres://nexus:${NEXUS_DB_PASSWORD:?NEXUS_DB_PASSWORD est requis}@postgres:5432/nexus
      # SESSION, pas TRANSACTION : nexus-api applique ses migrations au boot
      # (`sqlx::migrate!`), qui prend un verrou d'avis de SESSION. En pooling
      # transactionnel ce verrou est rendu au retour de chaque transaction et
      # ne protege plus rien — deux instances qui demarrent ensemble peuvent
      # appliquer la meme migration. Ce pool n'est pas ici pour le debit (le
      # volume jeux est faible) mais pour tenir nexus-api hors du reseau `data`.
      POOL_MODE: session
      MAX_CLIENT_CONN: 100
      # En mode session, chaque connexion cliente epingle une connexion serveur :
      # le plafond de concurrence reel est ce DEFAULT_POOL_SIZE, pas le pool
      # applicatif. Il doit donc etre >= NEXUS_DB_MAX_CONNECTIONS (defaut 20),
      # sinon les jobs restent en attente d'un slot serveur ("pool timed out").
      DEFAULT_POOL_SIZE: 25
      RESERVE_POOL_SIZE: 5
      ADMIN_USERS: nexus
      AUTH_TYPE: scram-sha-256
    depends_on:
      nexus-db-init:
        condition: service_completed_successfully
    networks:
      - data
      - internal

  nexus-bot:
    <<: *nexus-rust-base
    build:
      <<: *nexus-build-alpine
      args:
        BIN_NAME: nexus-bot
    environment:
      # Serveur Discord unique servi par cette installation.
      # Les API refusent tout autre guild_id ; les bots quittent toute
      # autre guilde. Vide = verrou desactive.
      PUBLIC_GUILD_ID: ${PUBLIC_GUILD_ID:-}
      # La source publique du .env est NEXUS_BOT_TOKEN. Le binaire Nexus
      # lit NEXUS_DISCORD_TOKEN ; conserver aussi ce fallback historique.
      NEXUS_DISCORD_TOKEN: ${NEXUS_BOT_TOKEN:-${NEXUS_DISCORD_TOKEN:-}}
      NEXUS_API_URL: http://api:3100
      NEXUS_API_KEY: ${NEXUS_API_KEY:?NEXUS_API_KEY est requis}
      # URL publique servant web/public/imgs, requise par Discord pour charger
      # les bannieres des cartes de session de jeu.
      WEB_FRONT_URL: ${WEB_FRONT_URL:-}
      # Consomme la stream nexus:events (creation/suppression des salons de
      # session game-portal). MEME instance que nexus-api : un bus dont le
      # producteur et le consommateur sont sur deux Redis differents ne
      # transporte rien, et l'echec est silencieux.
      # `platform-common::event_bus` lit REDIS_URL. L'API unifiee utilise
      # NEXUS_REDIS_URL pour choisir son bus parmi plusieurs Redis, mais ce bot
      # ne consomme que Nexus et doit donc fournir le nom standard du bus.
      REDIS_URL: redis://:${NEXUS_REDIS_PASSWORD:?NEXUS_REDIS_PASSWORD est requis}@nexus-redis:6379
      # Lecture de l'activite de jeu des membres, pour les salons compteurs
      # « membres en partie » et « en jeu ET en vocal ». Sans cette ligne, la
      # variable pouvait bien valoir `true` dans le .env : le service declare
      # ses variables une a une, sans `env_file`, donc le conteneur ne la
      # recevait pas et les deux compteurs restaient eteints quoi qu'on regle.
      #
      # ORDRE A RESPECTER : cocher « Presence Intent » dans le portail Discord
      # Developer, PUIS passer ceci a true. L'inverse fait REFUSER la connexion
      # du bot, qui ne demarre plus du tout.
      NEXUS_PRESENCE_INTENT: ${NEXUS_PRESENCE_INTENT:-false}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      api:
        condition: service_healthy
      nexus-redis:
        condition: service_healthy
    # Connexion Discord Gateway -> internet + interne (API unifiee, Redis).
    networks:
      - internal
      - default

