# Outils d'administration et observabilite optionnels.
x-observability-default-logging: &observability-default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ──────────────────────────────────────────────────────────────────────────
  # Supervision et outils d'administration.
  # - monitoring : ensemble historique complet
  # - tools : pgAdmin + Redis Commander uniquement
  # - observability : Prometheus + Grafana uniquement
  # - full : tous les modules optionnels applicatifs (hors TLS)
  # ──────────────────────────────────────────────────────────────────────────

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sentinel-pgadmin
    restart: unless-stopped
    logging: *observability-default-logging
    # SECURITE — pgadmin = panneau admin DB, JAMAIS expose publiquement.
    # Acces via SSH tunnel : ssh -L 5050:localhost:5050 user@host
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@sentinel.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD est requis}
    depends_on:
      postgres:
        condition: service_healthy
    # pgadmin a besoin de joindre postgres (sur "data") direct.
    networks:
      - data
    profiles:
      - monitoring
      - tools
      - full

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: sentinel-redis-commander
    restart: unless-stopped
    logging: *observability-default-logging
    # SECURITE — redis-commander = panneau admin Redis, JAMAIS expose
    # publiquement. Acces SSH tunnel : ssh -L 8081:localhost:8081 user@host
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:?REDIS_PASSWORD est requis}
    depends_on:
      redis:
        condition: service_healthy
    # redis-commander a besoin de joindre Redis (sur "internal").
    networks:
      - internal
    profiles:
      - monitoring
      - tools
      - full

  # One-shot : ecrit le jeton de scrape dans un fichier lisible par Prometheus.
  #
  # POURQUOI UN CONTENEUR POUR UNE LIGNE
  #
  # Prometheus n'interpole PAS les variables d'environnement dans sa
  # configuration : `credentials: ${METRICS_TOKEN}` y serait pris au pied de la
  # lettre. Il sait en revanche lire un `credentials_file`. Il faut donc que
  # quelqu'un ecrive ce fichier — et ce n'est pas au depot de le contenir, ce
  # serait un secret en clair dans git.
  #
  # Meme motif que les snippets de cle nginx (`3x-*-key.sh`) : un tiers ecrit le
  # secret au demarrage, le service qui s'en sert ne le connait que par fichier.
  #
  # `prom/prometheus` est une image minimale dont le shell n'est pas garanti :
  # on n'y execute donc rien, c'est alpine qui ecrit dans le volume partage.
  prometheus-token-init:
    image: alpine:3.20
    container_name: sentinel-prometheus-token-init
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN est requis}
    volumes:
      - prometheus_secrets:/secrets
    # `printf` et non `echo` : pas de saut de ligne final. Prometheus enverrait
    # le fichier tel quel dans l'en-tete Authorization, et un `\n` invalide le
    # jeton — panne silencieuse cote scrape, 401 cote API.
    entrypoint:
      - sh
      - -euc
      - |
        printf '%s' "$$METRICS_TOKEN" > /secrets/metrics-token
        chmod 0444 /secrets/metrics-token
    restart: "no"
    profiles:
      - monitoring
      - observability
      - full

  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel-prometheus
    restart: unless-stopped
    logging: *observability-default-logging
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      prometheus-token-init:
        condition: service_completed_successfully
    volumes:
      - ../../infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_secrets:/secrets:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    # prometheus scrape /metrics sur les workers (tous sur "internal").
    networks:
      - internal
    profiles:
      - monitoring
      - observability
      - full

  grafana:
    image: grafana/grafana:latest
    container_name: sentinel-grafana
    restart: unless-stopped
    logging: *observability-default-logging
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD est requis}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    # grafana query prometheus (sur "internal").
    networks:
      - internal
    profiles:
      - monitoring
      - observability
      - full
