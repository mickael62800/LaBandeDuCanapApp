# Docker Compose pour les tests d'integration.
# Usage : docker compose -f infrastructure/docker/docker-compose.test.yml up -d
#         ./infrastructure/scripts/run-tests.sh
#         docker compose -f infrastructure/docker/docker-compose.test.yml down -v

# Project name dedie pour eviter toute collision avec le stack prod
# (`discordsentinel`).
name: discordsentinel-test

services:
  postgres-test:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: sentinel-test-postgres
    environment:
      POSTGRES_USER: sentinel_test
      POSTGRES_PASSWORD: sentinel_test
      POSTGRES_DB: sentinel_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel_test"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis-test:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: sentinel-test-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
