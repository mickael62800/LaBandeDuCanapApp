# ============================================================================
# DiscordSentinel — Docker Compose stack
#
# Convention :
#   - context: ../..  (racine du repo)
#   - Tous les services Rust utilisent les Dockerfiles generiques :
#       infrastructure/docker/Dockerfile.rust-alpine  (gateway, bot, 13 workers)
#       infrastructure/docker/Dockerfile.rust-debian  (api, glibc 2.38+ pour ONNX)
#   - YAML anchors (x-...) pour eliminer la duplication entre workers.
# ============================================================================

# CRITIQUE — project name fige a `discordsentinel` pour preserver les volumes
# existants (postgres_data, redis_data, etc.) malgre le deplacement du compose
# vers infrastructure/docker/. Sans ca, un `docker compose up` lance depuis un autre
# dossier creerait de NOUVEAUX volumes vides.
name: discordsentinel

# ── Anchors partages ────────────────────────────────────────────────────────

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Defaults pour tous les services Rust : restart policy, init (tini PID 1),
# logging avec rotation. A merger avec `<<: *rust-base`.
x-rust-base: &rust-base
  restart: unless-stopped
  init: true
  logging: *default-logging

# Env partagee par les workers (pgbouncer + redis + api). Override possible
# via merge ou redefinition. METRICS_PORT est utilise par worker-common pour
# exposer /metrics (utilise par les healthchecks).
x-worker-env: &worker-env
  DATABASE_URL: postgres://sentinel:${POSTGRES_PASSWORD:-sentinel_secret}@pgbouncer:5432/discord_sentinel
  REDIS_URL: redis://:${REDIS_PASSWORD:-sentinel_redis}@redis:6379
  API_URL: http://api:3000
  SENTINEL_API_KEY: ${SENTINEL_API_KEY:-}
  METRICS_PORT: "9100"
  RUST_LOG: ${RUST_LOG:-info}

# Healthcheck commun aux workers : ping /metrics expose par worker-common.
# Plus fiable que `pidof` (process bloque mais vivant => pidof passe).
x-worker-healthcheck: &worker-healthcheck
  test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:9100/metrics || exit 1"]
  interval: 30s
  timeout: 3s
  retries: 3
  start_period: 15s

# Build alpine generique (workers, gateway, bot). Le BIN_NAME est specifie
# par chaque service (le seul element qui change reellement).
x-build-alpine: &build-alpine
  context: ../..
  dockerfile: infrastructure/docker/Dockerfile.rust-alpine

# depends_on standard pour les workers DB-bound : pgbouncer + redis + api.
# L'API doit etre healthy avant les workers, sinon ils echouent au boot
# (heartbeat 401, lifecycle log timeout, /api/.../internal/jobs/* refuses).
x-worker-deps-db-redis: &worker-deps-db-redis
  pgbouncer:
    condition: service_started
  redis:
    condition: service_healthy
  api:
    condition: service_healthy

# Reseaux par defaut pour les workers : "internal" uniquement (PAS d'internet).
# Override avec [internal, default] pour les workers qui ont besoin de Discord
# (discord-audit-sync-worker).
x-worker-networks-internal: &worker-networks-internal
  - internal

x-worker-networks-with-internet: &worker-networks-with-internet
  - internal
  - default

services:

  # ──────────────────────────────────────────────────────────────────────────
  # Init mTLS gRPC : genere une CA + cert serveur + cert client partages.
  # Idempotent (ne regenere pas si deja present). Volume shared en read-only
  # avec l'API (server) et les clients gRPC (workers + bot).
  # ──────────────────────────────────────────────────────────────────────────
  grpc-certs-init:
    image: alpine:3.20
    container_name: sentinel-grpc-certs-init
    environment:
      CERT_DIR: /grpc-certs
      CN_SERVER: api
    volumes:
      - grpc_certs:/grpc-certs
      - ./scripts:/init:ro
    # alpine:3.20 fournit busybox sans openssl, on l'installe au boot puis on
    # lance le script. Pas de `command:` ici, l'entrypoint fait tout.
    entrypoint:
      - sh
      - -c
      - "apk add --no-cache openssl >/dev/null && sh /init/gen-grpc-certs.sh"
    # Besoin d'internet pour `apk add openssl` au premier boot.
    networks:
      - default

  # ──────────────────────────────────────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    container_name: sentinel-postgres
    restart: unless-stopped
    logging: *default-logging
    # NOTE Phase 0 — observabilite : `shared_preload_libraries=pg_stat_statements`
    # est obligatoire pour identifier les queries lentes (cf. docs/BASELINE_METRICS.md).
    # Le `CREATE EXTENSION` correspondant est dans la migration `099_enable_pg_stat_statements.sql`.
    #
    # Phase 2 A.5 — Tuning RAM (cible serveur 16 GB) :
    #   - shared_buffers 4GB (25 % RAM, 5-50x sur queries read-heavy)
    #   - effective_cache_size 10GB (planificateur prefere index scans)
    #   - work_mem 64MB (sorts/joins 10-100x, budget 30 conn x 64MB x 2 = 3.8GB max)
    #   - maintenance_work_mem 1GB (VACUUM/REINDEX 5-10x)
    #   - WAL tuning : wal_buffers=16MB, max_wal_size=4GB pour lisser les checkpoints
    command: >-
      postgres
      -c max_connections=150
      -c shared_buffers=4GB
      -c effective_cache_size=10GB
      -c work_mem=64MB
      -c maintenance_work_mem=1GB
      -c wal_buffers=16MB
      -c checkpoint_completion_target=0.9
      -c max_wal_size=4GB
      -c min_wal_size=1GB
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_secret}
      POSTGRES_DB: discord_sentinel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d discord_sentinel"]
      interval: 5s
      timeout: 5s
      retries: 5
    # SECURITE — postgres isole sur un reseau "data" interne (pas d'acces
    # internet). Seul pgbouncer peut le joindre (lui-meme bi-network pour
    # servir de bridge). Un service applicatif compromis ne peut PAS taper
    # postgres en direct, il doit passer par pgbouncer (auth scram-sha-256).
    networks:
      - data

  # PgBouncer en transaction pooling devant Postgres (pas de healthcheck CMD :
  # edoburu/pgbouncer n'a ni nc ni pg_isready ; il demarre en ~1s apres postgres
  # healthy donc `condition: service_started` cote consommateur suffit).
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: sentinel-pgbouncer
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgres://sentinel:${POSTGRES_PASSWORD:-sentinel_secret}@postgres:5432/discord_sentinel
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 3
      MAX_PREPARED_STATEMENTS: 100
      SERVER_RESET_QUERY: DISCARD ALL
      ADMIN_USERS: sentinel
      AUTH_TYPE: scram-sha-256
    ports:
      - "127.0.0.1:6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    # SECURITE — pgbouncer est bi-network : il joint postgres via "data"
    # (isole) et expose le pool aux clients via "internal" (no-internet).
    networks:
      - data
      - internal

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    restart: unless-stopped
    logging: *default-logging
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD:-sentinel_redis}
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-sentinel_redis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    # SECURITE — Redis n'a PAS besoin d'internet, isole sur "internal".
    networks:
      - internal

  # ──────────────────────────────────────────────────────────────────────────
  # Backend
  # ──────────────────────────────────────────────────────────────────────────

  api:
    <<: *rust-base
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.rust-debian
      args:
        BIN_NAME: sentinel-api
        MIGRATIONS_SRC: sentinel-api/migrations
    # SECURITE — `pid: host` partage le namespace PID de l'host avec le
    # conteneur pour que sysinfo remonte le CPU/RAM reel (endpoint /api/system/info).
    # Mitigations : `no-new-privileges` bloque toute escalade.
    pid: host
    security_opt:
      - no-new-privileges:true
    # SECURITE — l'API est reachable depuis l'exterieur UNIQUEMENT via le
    # proxy nginx du service `web` (location /api/). On bind donc 127.0.0.1
    # pour conserver un acces local debug (curl/SSH tunnel) sans exposer
    # publiquement. Le gRPC 50051 est utilise par les bots/workers via le
    # reseau docker interne, idem.
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:50051:50051"
    # Healthcheck gRPC : avec mTLS active, on doit presenter le cert client
    # pour passer le check. Si GRPC_TLS_DIR n'est pas defini (mode plain),
    # ces flags sont ignores en pratique car le serveur n'exige rien.
    # Note : -tls-server-name="api" car le SAN du cert serveur est "api".
    healthcheck:
      test:
        - "CMD"
        - "grpc_health_probe"
        - "-addr=:50051"
        - "-tls"
        - "-tls-ca-cert=/grpc-certs/ca.pem"
        - "-tls-client-cert=/grpc-certs/client.pem"
        - "-tls-client-key=/grpc-certs/client.key"
        - "-tls-server-name=api"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    environment:
      # Relais des jeux joues depuis le site. Le navigateur ne joint
      # jamais nexus-api : il passe par sentinel-api, seul composant a
      # savoir QUI est connecte. La cle ne quitte donc pas le reseau interne.
      NEXUS_API_URL: http://nexus-api:3100
      NEXUS_API_KEY: ${NEXUS_API_KEY:-}
      # Acces au daemon Docker : plus de socket ici, on passe par l'agent.
      DOCKER_AGENT_URL: http://docker-agent:8095
      DOCKER_AGENT_TOKEN: ${DOCKER_AGENT_TOKEN:?DOCKER_AGENT_TOKEN est requis}
      # Serveur Discord unique servi par cette installation.
      # Les API refusent tout autre guild_id ; les bots quittent toute
      # autre guilde. Vide = verrou desactive.
      PUBLIC_GUILD_ID: ${PUBLIC_GUILD_ID:-}
      DATABASE_URL: postgres://sentinel:${POSTGRES_PASSWORD:-sentinel_secret}@pgbouncer:5432/discord_sentinel
      REDIS_URL: redis://:${REDIS_PASSWORD:-sentinel_redis}@redis:6379
      SENTINEL_API_KEY: ${SENTINEL_API_KEY:-}
      SENTINEL_REQUIRE_API_KEY: ${SENTINEL_REQUIRE_API_KEY:-true}
      # Gate RBAC global fail-closed par route (defaut false). Mettre a "true"
      # active la deuxieme couche de defense en profondeur devant les gardes par
      # handler. Surchargeable via la var RBAC_GLOBAL_GATE du .env docker.
      RBAC_GLOBAL_GATE: ${RBAC_GLOBAL_GATE:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # Optionnel : protege /metrics par un Bearer token. Vide = ouvert (scrape
      # interne sans auth). Si defini, configurer aussi le job Prometheus.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
      WEB_FRONT_URL: ${WEB_FRONT_URL:-}
      SUPERADMIN_USER_IDS: ${SUPERADMIN_USER_IDS:-}
      # La source publique du .env est SENTINEL_BOT_TOKEN. Le nom injecte
      # reste SENTINEL_DISCORD_TOKEN, celui lu par les binaires Rust.
      SENTINEL_DISCORD_TOKEN: ${SENTINEL_BOT_TOKEN:-${SENTINEL_DISCORD_TOKEN:-${DISCORD_TOKEN:-}}}
      DEEPSEEK_MODERATION_API_KEY: ${DEEPSEEK_MODERATION_API_KEY:-}
      DEEPSEEK_MODERATION_MODEL: ${DEEPSEEK_MODERATION_MODEL:-deepseek-chat}
      DEEPSEEK_MODERATION_ENDPOINT: ${DEEPSEEK_MODERATION_ENDPOINT:-https://api.deepseek.com/chat/completions}
      VISION_MODEL_PATH: /models/vision/vision_sentinel.onnx
      TEXT_MODEL_PATH: /models/text/text_sentinel.onnx
      TEXT_TOKENIZER_PATH: /models/text/tokenizer.json
      TEXT_MAX_LENGTH: "256"
      RUST_LOG: ${RUST_LOG:-info}
      # mTLS gRPC : si defini, le serveur exige un cert client signe par
      # notre CA interne. Sinon plain HTTP/2.
      GRPC_TLS_DIR: ${GRPC_TLS_DIR:-/grpc-certs}
      # Pour l'endpoint /api/security/tls-cert : domaine du cert Let's Encrypt
      # a lire dans /etc/letsencrypt/live/{WEB_DOMAIN}/cert.pem
      WEB_DOMAIN: ${WEB_DOMAIN:-localhost}
    volumes:
      - ../../sentinel-ml/vision/exports:/models/vision:ro
      - ../../sentinel-ml/text/exports:/models/text:ro
      # PLUS de socket Docker ici : il equivaut a un acces root sur l'hote et
      # n'a rien a faire dans le processus qui sert l'OAuth, la moderation et
      # les routes communautaires. Les endpoints /api/docker/* passent par le
      # service `docker-agent`, seul a le monter.
      # Certs mTLS gRPC (genere par grpc-certs-init au boot, partage en RO).
      - grpc_certs:/grpc-certs:ro
      # Cert Let's Encrypt en RO pour endpoint /api/security/tls-cert
      # (lecture de cert.pem pour afficher l'expiration sur la page Securite).
      - letsencrypt_etc:/etc/letsencrypt:ro
      # Fichiers host security (RW) :
      # - Lecture : fail2ban-status.json, ssh-failures.json, disk-trend.json,
      #   open-ports.json, file-integrity.json, etc. (genere par cron host).
      # - Ecriture : bans-pending.txt / unbans-pending.txt (consomme par
      #   sentinel-apply-bans.sh cron host) pour /api/security/ban-ip
      #   et /api/security/unban-ip.
      # Si le repertoire n'existe pas, les endpoints lecture retournent
      # installed=false avec les instructions setup-host-security.sh.
      - /var/lib/sentinel:/var/lib/sentinel
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      grpc-certs-init:
        condition: service_completed_successfully
      docker-agent:
        condition: service_started
    # SECURITE — API a besoin d'internet (Discord OAuth, get_user_guilds).
    # internal : Redis + pgbouncer + autres services internes.
    # default : sortie internet (Discord).
    networks:
      - internal
      - default

  # ── Agent Docker ────────────────────────────────────────────────────────
  #
  # SEUL service du depot a monter /var/run/docker.sock, qui equivaut a un
  # acces root sur l'hote. Il etait auparavant monte par `api`, c'est-a-dire
  # par le processus qui sert aussi l'OAuth, la moderation Discord et toutes
  # les routes communautaires : une faille dans cette surface donnait l'hote.
  #
  # L'agent n'a ni base, ni session, ni utilisateurs, ni route nginx. Il n'est
  # joignable que sur le reseau `internal`, par les services qui portent
  # DOCKER_AGENT_TOKEN, et n'expose que les operations du port `DockerHost`
  # (liste blanche) — jamais un passe-plat generique vers l'API Docker.
  docker-agent:
    <<: *rust-base
    build:
      <<: *build-alpine
      args:
        BIN_NAME: docker-agent
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      DOCKER_AGENT_BIND_ADDR: 0.0.0.0:8095
      # Requis : l'agent REFUSE de demarrer sans jeton d'au moins 16
      # caracteres. Mieux vaut un service arrete qu'un socket ouvert a tout
      # le reseau interne.
      DOCKER_AGENT_TOKEN: ${DOCKER_AGENT_TOKEN:?DOCKER_AGENT_TOKEN est requis}
    # GID du groupe `docker` de l'host, proprietaire du socket. Sans lui, le
    # user non-root du conteneur ne peut pas l'ouvrir.
    # Override : DOCKER_GID=$(stat -c '%g' /var/run/docker.sock) dans .env.
    group_add:
      - "${DOCKER_GID:-988}"
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # PAS de `ports:` — l'agent ne doit jamais etre joignable depuis l'hote
    # ni depuis l'exterieur, uniquement par les autres conteneurs.
    #
    # `internal` uniquement : il n'a aucune raison de sortir sur internet.
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8095/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ── API Exploitation ────────────────────────────────────────────────────
  #
  # Ecrans de la MACHINE hote (sondes, Docker, logs techniques, securite de
  # l'hote, regles d'alerte), transverses aux trois plateformes Discord.
  #
  # Se connecte a la base de Sentinel : Postgres ne sait pas requeter entre
  # bases logiques, or l'exploitation doit LIRE `logs` et `audit_logs`. La
  # separation passe par un role restreint, pas par une base dediee.
  ops-api:
    <<: *rust-base
    build:
      <<: *build-alpine
      args:
        BIN_NAME: ops-api
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      OPS_API_BIND_ADDR: 0.0.0.0:3200
      OPS_DATABASE_URL: postgres://sentinel:${POSTGRES_PASSWORD:-sentinel_secret}@pgbouncer:5432/discord_sentinel
      # Requis : l'API refuse de demarrer sans jeton d'au moins 16 caracteres.
      OPS_API_TOKEN: ${OPS_API_TOKEN:?OPS_API_TOKEN est requis}
      OPS_METRICS_TOKEN: ${OPS_METRICS_TOKEN:-}
      DOCKER_AGENT_URL: http://docker-agent:8095
      DOCKER_AGENT_TOKEN: ${DOCKER_AGENT_TOKEN:?DOCKER_AGENT_TOKEN est requis}
      WEB_DOMAIN: ${WEB_DOMAIN:-localhost}
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/lib/sentinel:/var/lib/sentinel:ro
    networks:
      - internal
      - default
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      docker-agent:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3200/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

  gateway:
    <<: *rust-base
    build:
      <<: *build-alpine
      args:
        BIN_NAME: sentinel-gateway
    # SECURITE — gateway reachable via /ws du proxy nginx, pas de raison
    # de l'exposer publiquement. 127.0.0.1 = acces local debug uniquement.
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3001/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-sentinel_redis}@redis:6379
      REDIS_CHANNEL: sentinel:events
      # API_URL : utilise pour valider les tokens WS via /api/auth/check-access.
      # Sans ca, fallback localhost:3000 -> appel vers gateway lui-meme -> WS rejete 401.
      API_URL: http://api:3000
      API_KEY: ${SENTINEL_API_KEY:-${API_KEY:-}}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      HOST: 0.0.0.0
      PORT: "3001"
      MAX_CONNECTIONS: "1000"
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    # NOTE — gateway a besoin de default pour que le port publish 127.0.0.1:3001
    # fonctionne (Docker requiert un reseau non-internal pour le NAT host).
    # En pratique, gateway ne fait jamais d'outbound internet (juste Redis +
    # WebSocket inbound). Sa security depend du firewall externe (port non
    # ouvert) + auth du token WebSocket.
    networks:
      - internal
      - default

  # ──────────────────────────────────────────────────────────────────────────
  # sentinel-worker : binaire unique qui orchestre tous les jobs
  # periodiques (ex 15 workers fusionnes en avril 2026). Organise par
  # domaine en interne : `src/domains/{domain}/{job}.rs`.
  #
  # Toutes les variables d'env de tous les domaines + acces internet
  # (Discord pour les jobs ai/audit-sync/announcement) + grpc-certs
  # pour le job export.
  # ──────────────────────────────────────────────────────────────────────────
  sentinel-worker:
    <<: *rust-base
    build:
      <<: *build-alpine
      args:
        BIN_NAME: sentinel-worker
    healthcheck: *worker-healthcheck
    environment:
      <<: *worker-env
      # gRPC pour le job export
      GRPC_API_URL: http://api:50051
      GRPC_TLS_DIR: /grpc-certs
      # Discord (audit-sync, announcement)
      SENTINEL_DISCORD_TOKEN: ${SENTINEL_BOT_TOKEN:-${SENTINEL_DISCORD_TOKEN:-${DISCORD_TOKEN:-}}}
      # Cleanup
      VOICE_SESSIONS_RETENTION_DAYS: ${VOICE_SESSIONS_RETENTION_DAYS:-90}
      LOGS_RETENTION_DAYS: ${LOGS_RETENTION_DAYS:-30}
      CLOSED_TICKETS_RETENTION_DAYS: ${CLOSED_TICKETS_RETENTION_DAYS:-180}
      CLEANUP_INTERVAL_HOURS: ${CLEANUP_INTERVAL_HOURS:-1}
      VACUUM_ENABLED: ${VACUUM_ENABLED:-true}
      VACUUM_INTERVAL_HOURS: ${VACUUM_INTERVAL_HOURS:-24}
    volumes:
      - grpc_certs:/grpc-certs:ro
    depends_on:
      pgbouncer:
        condition: service_started
      grpc-certs-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    # Acces internet (Discord) + interne (Postgres/Redis/API).
    networks: *worker-networks-with-internet

  # ──────────────────────────────────────────────────────────────────────────
  # Bot unifie
  # ──────────────────────────────────────────────────────────────────────────
  #
  # Les 15 anciens bots (audit, automod, cleanup, community,
  # moderation, progression, roles, security, tickets, voice, welcome,
  # image) ont ete fusionnes en un seul binaire `sentinel-bot` structure en
  # modules. Un seul processus, une seule connexion Gateway Discord, un seul
  # cache, une seule TypeMap.
  #
  # Sharding Discord :
  #   SHARD_MODE=single  (defaut) : 1 shard, OK jusqu'a ~2500 guilds.
  #   SHARD_MODE=auto             : Serenity spawn tous les shards recommandes.
  #   SHARD_MODE=manual           : requiert SHARD_ID + SHARD_TOTAL (multi-replica).

  sentinel-bot:
    <<: *rust-base
    build:
      <<: *build-alpine
      args:
        BIN_NAME: sentinel-bot
    # Le bot n'expose pas /metrics par worker-common ; on retombe sur pidof.
    healthcheck:
      test: ["CMD-SHELL", "pidof sentinel-app || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    environment:
      # Serveur Discord unique servi par cette installation.
      # Les API refusent tout autre guild_id ; les bots quittent toute
      # autre guilde. Vide = verrou desactive.
      PUBLIC_GUILD_ID: ${PUBLIC_GUILD_ID:-}
      SENTINEL_DISCORD_TOKEN: ${SENTINEL_BOT_TOKEN:-${SENTINEL_DISCORD_TOKEN:-${DISCORD_TOKEN:-}}}
      API_BASE_URL: http://api:3000
      # Adresse PUBLIQUE du site, utilisee pour construire les URL d'images des
      # embeds Discord (web/public/imgs/). Discord ne peut pas lire un fichier
      # local du conteneur : il va chercher l'image lui-meme en HTTPS.
      WEB_FRONT_URL: ${WEB_FRONT_URL:-}
      GRPC_API_URL: http://api:50051
      GRPC_TLS_DIR: /grpc-certs
      # Le bot et son client gRPC lisent SENTINEL_API_KEY.
      SENTINEL_API_KEY: ${SENTINEL_API_KEY:-${API_KEY:-}}
      REDIS_URL: redis://:${REDIS_PASSWORD:-sentinel_redis}@redis:6379
      REDIS_CHANNEL: sentinel:events
      VOICE_GUILD_ID: ${VOICE_GUILD_ID:-}
      VOICE_PUBLIC_CREATOR_CHANNEL_ID: ${VOICE_PUBLIC_CREATOR_CHANNEL_ID:-}
      VOICE_PRIVATE_CREATOR_CHANNEL_ID: ${VOICE_PRIVATE_CREATOR_CHANNEL_ID:-}
      VOICE_LOG_CHANNEL_ID: ${VOICE_LOG_CHANNEL_ID:-}
      TICKET_CATEGORY_ID: ${TICKET_CATEGORY_ID:-}
      TICKET_CHANNEL_ID: ${TICKET_CHANNEL_ID:-}
      SHARD_MODE: ${SHARD_MODE:-single}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - grpc_certs:/grpc-certs:ro
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      grpc-certs-init:
        condition: service_completed_successfully
    # sentinel-bot : connexion Discord Gateway + REST -> internet + interne.
    networks:
      - internal
      - default

  # ──────────────────────────────────────────────────────────────────────────
  # Atrium — bot d'accueil IA (profil optionnel)
  # ──────────────────────────────────────────────────────────────────────────
  # L'API appelle DeepSeek et le bot joint Discord : tous deux ont donc acces
  # sortant. Leur liaison gRPC reste interne et n'expose aucun port sur l'hote.
  atrium-api:
    <<: *rust-base
    build:
      <<: *build-alpine
      args:
        BIN_NAME: atrium-api
    healthcheck:
      test: ["CMD-SHELL", "pidof sentinel-app || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    environment:
      ATRIUM_API_BIND_ADDR: 0.0.0.0:8090
      ATRIUM_GRPC_BIND_ADDR: 0.0.0.0:8091
      ATRIUM_API_TOKEN: ${ATRIUM_API_TOKEN:-}
      ATRIUM_GRPC_TOKEN: ${ATRIUM_GRPC_TOKEN:?ATRIUM_GRPC_TOKEN est requis}
      DEEPSEEK_API_KEY: ${ATRIUM_DEEPSEEK_API_KEY:-${DEEPSEEK_API_KEY:-}}
      DEEPSEEK_MODEL: ${ATRIUM_DEEPSEEK_MODEL:-${DEEPSEEK_MODEL:-deepseek-v4-flash}}
      ATRIUM_API_RATE_LIMIT_PER_SEC: ${ATRIUM_API_RATE_LIMIT_PER_SEC:-5}
      ATRIUM_USER_COOLDOWN_SECS: ${ATRIUM_USER_COOLDOWN_SECS:-10}
      ATRIUM_USER_DAILY_LIMIT: ${ATRIUM_USER_DAILY_LIMIT:-30}
      ATRIUM_GLOBAL_DAILY_LIMIT: ${ATRIUM_GLOBAL_DAILY_LIMIT:-500}
      # Base logique Atrium, isolee derriere son pool dedie.
      ATRIUM_RAG_DATABASE_URL: ${ATRIUM_RAG_DATABASE_URL:-postgres://sentinel:${POSTGRES_PASSWORD:-sentinel_secret}@atrium-pgbouncer:5432/atrium}
      ATRIUM_EMBEDDINGS_BASE_URL: ${ATRIUM_EMBEDDINGS_BASE_URL:-http://atrium-ollama:11434/v1}
      ATRIUM_EMBEDDINGS_API_KEY: ${ATRIUM_EMBEDDINGS_API_KEY:-}
      ATRIUM_EMBEDDINGS_MODEL: ${ATRIUM_EMBEDDINGS_MODEL:-nomic-embed-text}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      atrium-pgbouncer:
        condition: service_started
      atrium-ollama-init:
        condition: service_completed_successfully
    networks:
      - internal
      - default
    profiles:
      - atrium

  # Embeddings RAG locaux : pas de cle API ni de cout par requete.
  # Le modele est telecharge une fois dans le volume persistant puis reste
  # limite pour ne pas affamer Sentinel, Nexus et PostgreSQL.
  atrium-ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 2g
    cpus: 1.5
    # Le serveur effectue lui-meme le telechargement demande par le client
    # `ollama pull`; il doit donc resoudre et joindre registry.ollama.ai.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - atrium_ollama_data:/root/.ollama
    healthcheck:
      # Le modele est telecharge par `atrium-ollama-init` apres ce check :
      # verifier seulement que le serveur repond, sans creer une dependance
      # circulaire entre le healthcheck et le pull.
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - internal
      - default
    profiles:
      - atrium

  # Le pull est separe du serveur Ollama : le healthcheck du serveur peut
  # devenir vert avant le telechargement, mais Atrium ne demarre qu'apres.
  atrium-ollama-init:
    image: ollama/ollama:latest
    command: ["pull", "nomic-embed-text"]
    environment:
      # Le client Ollama du job doit joindre le serveur du conteneur voisin,
      # pas son propre localhost.
      OLLAMA_HOST: http://atrium-ollama:11434
    # Certains hotes Docker ont un resolv.conf non exploitable dans le bridge
    # (erreur 127.0.0.11). Ce job doit resoudre registry.ollama.ai une fois.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - atrium_ollama_data:/root/.ollama
    depends_on:
      atrium-ollama:
        condition: service_healthy
    networks:
      - internal
      # Necessaire uniquement au telechargement initial du modele depuis le
      # registre Ollama. Le serveur Ollama reste sur le reseau interne.
      - default
    restart: "no"
    profiles:
      - atrium

  atrium-bot:
    <<: *rust-base
    build:
      <<: *build-alpine
      args:
        BIN_NAME: atrium-bot
    healthcheck:
      test: ["CMD-SHELL", "pidof sentinel-app || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    environment:
      ATRIUM_DISCORD_TOKEN: ${ATRIUM_DISCORD_TOKEN:-}
      # Consomme les demandes d'apaisement publiees par Sentinel AutoMod.
      REDIS_URL: redis://:${REDIS_PASSWORD:-sentinel_redis}@redis:6379
      ATRIUM_GRPC_URL: http://atrium-api:8091
      ATRIUM_GRPC_TOKEN: ${ATRIUM_GRPC_TOKEN:?ATRIUM_GRPC_TOKEN est requis}
      ATRIUM_GENERAL_CHANNEL_ID: ${ATRIUM_GENERAL_CHANNEL_ID:-}
      ATRIUM_SERVER_CONTEXT: ${ATRIUM_SERVER_CONTEXT:-}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      atrium-api:
        condition: service_healthy
    networks:
      - internal
      - default
    profiles:
      - atrium

  # ──────────────────────────────────────────────────────────────────────────
  # Web (SPA Vue 3 servie par nginx, HTTPS)
  # ──────────────────────────────────────────────────────────────────────────

  web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    init: true
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:-localhost}
      # Injectee cote serveur dans le proxy /nexus-api/ par
      # /docker-entrypoint.d/30-nexus-key.sh. Ne transite JAMAIS jusqu'au
      # navigateur : nexus-api n'a qu'une cle statique, la divulguer donnerait
      # un acces admin complet a la plateforme jeux.
      NEXUS_API_KEY: ${NEXUS_API_KEY:-}
      # Meme principe pour le proxy /atrium-api/, injecte par
      # /docker-entrypoint.d/31-atrium-key.sh. atrium-api n'est pas publie sur
      # l'hote : cette passerelle est le SEUL chemin du back-office vers lui.
      ATRIUM_API_TOKEN: ${ATRIUM_API_TOKEN:-}
      # Injecté cote serveur dans le proxy /ops-api/ par /docker-entrypoint.d/32-ops-key.sh
      OPS_API_TOKEN: ${OPS_API_TOKEN:-}
      # Configuration PUBLIQUE du site, ecrite dans site-config.json au
      # demarrage. Sans PUBLIC_GUILD_ID, l'espace membre n'affiche aucune
      # section : il ne sait pas de quel serveur parler.
      PUBLIC_GUILD_ID: ${PUBLIC_GUILD_ID:-}
      DISCORD_INVITE: ${DISCORD_INVITE:-}
    volumes:
      - letsencrypt_etc:/etc/letsencrypt
      - letsencrypt_www:/var/www/certbot
      # Logs scanner (444 sur paths suspects) ecrits par nginx, lus par
      # le jail fail2ban `nginx-scanner` cote host. Le repertoire host
      # /var/log/sentinel-nginx doit appartenir a UID 101 (user nginx
      # dans nginx:1.27-alpine) — gere par setup-host-security.sh.
      - /var/log/sentinel-nginx:/var/log/nginx/sentinel
    healthcheck:
      # 127.0.0.1 explicit : evite que wget resolve localhost en IPv6 [::1]
      # alors que nginx ecoute en IPv4 -> faux positif "unhealthy".
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
      gateway:
        condition: service_started
    # NOTE — web (nginx) a besoin de default pour que le port publish 80/443
    # fonctionne (Docker requiert un reseau non-internal pour le NAT host).
    # internal donne acces aux upstreams (api, gateway). nginx ne fait jamais
    # d'outbound internet -> pas de risque d'exfiltration.
    networks:
      - internal
      - default

  # Certbot Let's Encrypt — active via profile `tls`.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - letsencrypt_etc:/etc/letsencrypt
      - letsencrypt_www:/var/www/certbot
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      LETSENCRYPT_STAGING: ${LETSENCRYPT_STAGING:-}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        apk add --no-cache docker-cli >/dev/null
        if [ -z "$${WEB_DOMAIN:-}" ] || [ -z "$${LETSENCRYPT_EMAIL:-}" ]; then
          echo "[certbot] WEB_DOMAIN et LETSENCRYPT_EMAIL requis dans .env"
          sleep infinity
        fi
        STAGING_FLAG=""
        if [ -n "$${LETSENCRYPT_STAGING:-}" ]; then
          STAGING_FLAG="--staging"
          echo "[certbot] STAGING mode actif (certs non trustables, pour tests)"
        fi
        # On RESTART le conteneur web (et non un simple HUP nginx) : le symlink
        # /etc/nginx/certs -> cert actif est pose par l'entrypoint AU DEMARRAGE
        # uniquement, et il pointe sur le self-signed tant que le conteneur n'a
        # pas ete relance. Un reload nginx re-lit le meme symlink (toujours
        # self-signed) : seul un restart re-execute l'entrypoint et bascule sur
        # le cert Let's Encrypt fraichement emis. Le conteneur certbot ne monte
        # pas /etc/nginx/certs, il ne peut donc pas re-symlinker lui-meme.
        DEPLOY_HOOK='docker restart $$(docker ps -q -f label=com.docker.compose.service=web) || true'
        certbot certonly --webroot -w /var/www/certbot \
          --non-interactive --agree-tos --email "$$LETSENCRYPT_EMAIL" \
          $$STAGING_FLAG --keep-until-expiring \
          -d "$$WEB_DOMAIN" || echo "[certbot] premiere obtention echouee, retry au prochain cycle"
        docker restart $$(docker ps -q -f label=com.docker.compose.service=web) 2>/dev/null || true
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet \
            --deploy-hook "$$DEPLOY_HOOK" || true
          sleep 12h & wait $${!}
        done
    depends_on:
      web:
        condition: service_started
    # certbot a besoin d'internet (Let's Encrypt ACME).
    networks:
      - default
    profiles:
      - tls

  # ──────────────────────────────────────────────────────────────────────────
  # Monitoring (profile `monitoring`)
  # ──────────────────────────────────────────────────────────────────────────

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sentinel-pgadmin
    restart: unless-stopped
    logging: *default-logging
    # SECURITE — pgadmin = panneau admin DB, JAMAIS expose publiquement.
    # Acces via SSH tunnel : ssh -L 5050:localhost:5050 user@host
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@sentinel.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
    # pgadmin a besoin de joindre postgres (sur "data") direct.
    networks:
      - data
    profiles:
      - monitoring

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: sentinel-redis-commander
    restart: unless-stopped
    logging: *default-logging
    # SECURITE — redis-commander = panneau admin Redis, JAMAIS expose
    # publiquement. Acces SSH tunnel : ssh -L 8081:localhost:8081 user@host
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-sentinel_redis}
    depends_on:
      redis:
        condition: service_healthy
    # redis-commander a besoin de joindre Redis (sur "internal").
    networks:
      - internal
    profiles:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel-prometheus
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../../infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    # prometheus scrape /metrics sur les workers (tous sur "internal").
    networks:
      - internal
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: sentinel-grafana
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    # grafana query prometheus (sur "internal").
    networks:
      - internal
    profiles:
      - monitoring

  # ──────────────────────────────────────────────────────────────────────────
  # Nexus (plateforme jeux) — profile `nexus`, n'affecte pas la stack Sentinel.
  #   docker compose --profile nexus up -d
  # Services : nexus-db-init (one-shot), nexus-api, nexus-bot, nexus-worker.
  # Base `nexus` SEPAREE sur le meme Postgres (creee par nexus-db-init).
  # Les migrations nexus (nexus-api/migrations) sont embarquees dans le
  # binaire (sqlx::migrate!) et appliquees au boot de nexus-api.
  # ──────────────────────────────────────────────────────────────────────────

  # One-shot idempotent : Atrium a sa base logique, dans l'unique conteneur
  # PostgreSQL de la plateforme.
  atrium-db-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-sentinel_secret}
    entrypoint:
      - sh
      - -c
      - >-
        psql -h postgres -U sentinel -d discord_sentinel -tc
        "SELECT 1 FROM pg_database WHERE datname = 'atrium'" | grep -q 1 ||
        psql -h postgres -U sentinel -d discord_sentinel -c "CREATE DATABASE atrium"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    profiles:
      - atrium

  # Pool dedie : atrium-api reste sur le reseau interne et ne joint jamais
  # PostgreSQL directement.
  atrium-pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgres://sentinel:${POSTGRES_PASSWORD:-sentinel_secret}@postgres:5432/atrium
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 2
      ADMIN_USERS: sentinel
      AUTH_TYPE: scram-sha-256
    depends_on:
      atrium-db-init:
        condition: service_completed_successfully
    networks:
      - data
      - internal
    profiles:
      - atrium

  # One-shot : cree la base `nexus` si absente (idempotent).
  nexus-db-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-sentinel_secret}
    entrypoint:
      - sh
      - -c
      - >-
        psql -h postgres -U sentinel -d discord_sentinel -tc
        "SELECT 1 FROM pg_database WHERE datname = 'nexus'" | grep -q 1 ||
        psql -h postgres -U sentinel -d discord_sentinel -c "CREATE DATABASE nexus"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    profiles:
      - nexus

  nexus-api:
    <<: *rust-base
    build:
      <<: *build-alpine
      args:
        BIN_NAME: nexus-api
    # PAS de `ports:` volontairement — point d'entree unique. nexus-api n'est
    # joignable que par le reseau docker `internal` : le proxy nginx du service
    # `web` (qui authentifie et injecte la cle), le bot et le worker. Pour un
    # acces de debug ponctuel :
    #   docker compose exec nexus-api wget -qO- http://127.0.0.1:3100/health
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3100/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    environment:
      # Serveur Discord unique servi par cette installation.
      # Les API refusent tout autre guild_id ; les bots quittent toute
      # autre guilde. Vide = verrou desactive.
      PUBLIC_GUILD_ID: ${PUBLIC_GUILD_ID:-}
      # Connexion DIRECTE a postgres (base nexus) : pgbouncer ne route que
      # discord_sentinel. Volume faible (jeux) -> pas besoin de pooler.
      NEXUS_DATABASE_URL: postgres://sentinel:${POSTGRES_PASSWORD:-sentinel_secret}@postgres:5432/nexus
      NEXUS_API_KEY: ${NEXUS_API_KEY:-}
      NEXUS_API_PORT: "3100"
      NEXUS_GRPC_PORT: "3101"
      # L'API Nexus appelle aussi Discord (gestion des salons de session).
      # Elle doit recevoir le meme token que nexus-bot.
      NEXUS_DISCORD_TOKEN: ${NEXUS_BOT_TOKEN:-${NEXUS_DISCORD_TOKEN:-}}
      # Optionnel : protege /metrics par un Bearer. Vide = ouvert (le port
      # n'est joignable que depuis le reseau interne ou vit Prometheus).
      # Si defini, configurer le meme token dans le job prometheus.
      NEXUS_METRICS_TOKEN: ${NEXUS_METRICS_TOKEN:-}
      # Origines CORS autorisees. Vide = origines de dev uniquement ; en prod
      # le front est same-origin derriere nginx, donc CORS ne joue pas.
      NEXUS_ALLOWED_ORIGINS: ${NEXUS_ALLOWED_ORIGINS:-${ALLOWED_ORIGINS:-}}
      # Rate limit par IP. Le debit "heavy" s'applique aux routes qui lancent
      # un conteneur (create/start/stop/restart/delete/command) : deliberement
      # bas, un humain qui clique ne l'atteint jamais.
      NEXUS_RATE_LIMIT_PER_SEC: ${NEXUS_RATE_LIMIT_PER_SEC:-50}
      NEXUS_HEAVY_RATE_LIMIT_PER_SEC: ${NEXUS_HEAVY_RATE_LIMIT_PER_SEC:-2}
      NEXUS_MAX_BODY_SIZE: ${NEXUS_MAX_BODY_SIZE:-10485760}
      # Nombre de proxies de confiance devant l'API (nginx du service web).
      # Sert a lire la bonne IP dans X-Forwarded-For sans se faire spoofer.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # Redis : allocation atomique des ports de jeu ET bus d'evenements
      # game-portal (stream nexus:events consomme par nexus-bot). Sans lui,
      # l'API bascule sur un publieur inerte et les salons de session ne sont
      # jamais crees.
      REDIS_URL: redis://:${REDIS_PASSWORD:-sentinel_redis}@redis:6379
      # Runtime des serveurs de jeu : docker | noop. `noop` par defaut (aucun
      # container reel) : passer a `docker` quand la flotte doit tourner.
      NEXUS_GAME_RUNTIME: ${NEXUS_GAME_RUNTIME:-noop}
      RUST_LOG: ${RUST_LOG:-info}
    # GID du groupe `docker` de l'host, proprietaire du socket. Sans lui, le
    # user non-root du conteneur ne peut pas ouvrir /var/run/docker.sock.
    # Override : DOCKER_GID=$(stat -c '%g' /var/run/docker.sock) dans .env.
    group_add:
      - "${DOCKER_GID:-988}"
    security_opt:
      - no-new-privileges:true
    volumes:
      # SECURITE — socket Docker en RW : c'est ce qui permet a game-portal de
      # creer/demarrer/supprimer les containers de serveurs de jeu. Equivaut a
      # un acces root sur l'host, donc l'API reste bindee sur 127.0.0.1 et
      # protegee par NEXUS_API_KEY. Sans NEXUS_GAME_RUNTIME=docker, le socket
      # est monte mais jamais sollicite.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      nexus-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - data
      - internal
    profiles:
      - nexus

  nexus-bot:
    <<: *rust-base
    build:
      <<: *build-alpine
      args:
        BIN_NAME: nexus-bot
    environment:
      # Serveur Discord unique servi par cette installation.
      # Les API refusent tout autre guild_id ; les bots quittent toute
      # autre guilde. Vide = verrou desactive.
      PUBLIC_GUILD_ID: ${PUBLIC_GUILD_ID:-}
      # La source publique du .env est NEXUS_BOT_TOKEN. Le binaire Nexus
      # lit NEXUS_DISCORD_TOKEN ; conserver aussi ce fallback historique.
      NEXUS_DISCORD_TOKEN: ${NEXUS_BOT_TOKEN:-${NEXUS_DISCORD_TOKEN:-}}
      NEXUS_API_URL: http://nexus-api:3100
      NEXUS_API_KEY: ${NEXUS_API_KEY:-}
      # Consomme la stream nexus:events (creation/suppression des salons de
      # session game-portal). Meme Redis que l'API, sinon aucun event recu.
      REDIS_URL: redis://:${REDIS_PASSWORD:-sentinel_redis}@redis:6379
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      nexus-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Connexion Discord Gateway -> internet + interne (nexus-api, redis).
    networks:
      - internal
      - default
    profiles:
      - nexus

  # Jobs periodiques game-portal : health-check des containers, extinction des
  # serveurs inactifs, reconciliation etat DB/Docker, nettoyage des images,
  # revelation d'IP et ping quotidien. Le worker ne touche NI la DB NI Docker :
  # il appelle les endpoints internes de nexus-api.
  nexus-worker:
    <<: *rust-base
    build:
      <<: *build-alpine
      args:
        BIN_NAME: nexus-worker
    environment:
      NEXUS_API_URL: http://nexus-api:3100
      NEXUS_API_KEY: ${NEXUS_API_KEY:-}
      GAME_HEALTH_CHECK_INTERVAL_SECS: ${GAME_HEALTH_CHECK_INTERVAL_SECS:-30}
      GAME_IDLE_SHUTDOWN_CHECK_INTERVAL_SECS: ${GAME_IDLE_SHUTDOWN_CHECK_INTERVAL_SECS:-3600}
      GAME_RECONCILER_INTERVAL_SECS: ${GAME_RECONCILER_INTERVAL_SECS:-3600}
      GAME_IMAGE_CLEANUP_INTERVAL_SECS: ${GAME_IMAGE_CLEANUP_INTERVAL_SECS:-86400}
      GAME_REVEAL_IP_INTERVAL_SECS: ${GAME_REVEAL_IP_INTERVAL_SECS:-300}
      GAME_DAILY_PING_INTERVAL_SECS: ${GAME_DAILY_PING_INTERVAL_SECS:-3600}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      nexus-api:
        condition: service_healthy
    # Pas d'internet : ne parle qu'a nexus-api.
    networks:
      - internal
    profiles:
      - nexus

volumes:
  postgres_data:
  atrium_ollama_data:
  redis_data:
  prometheus_data:
  grafana_data:
  letsencrypt_etc:
  letsencrypt_www:
  # Certs mTLS gRPC (CA + server + client) generes au boot par grpc-certs-init.
  # Persistent : pas de regeneration au redemarrage. Pour rotater : delete le
  # volume et relance le compose.
  grpc_certs:

# Networks (defense en profondeur, 3 niveaux d'isolation) :
#
#   - default (sentinel) : reseau AVEC internet sortant. Reserve aux services
#     qui ont besoin de joindre Discord ou Let's Encrypt :
#       api, sentinel-bot, certbot, discord-audit-sync-worker
#     Les autres services n'ont PAS d'acces internet (defense exfiltration
#     de donnees en cas de zero-day).
#
#   - internal : reseau SANS internet (internal: true) pour communication
#     inter-services (Redis, gRPC, healthchecks, etc.). Tous les services
#     y sont sauf postgres (sur "data").
#
#   - data : reseau isole pour postgres uniquement. Seul pgbouncer est
#     bi-network (data + internal) pour faire le pont.
#
# Resultat : un worker compromis sur "internal" seulement ne peut ni
# atteindre postgres directement, ni exfiltrer des donnees vers internet.
networks:
  default:
    name: sentinel
    driver: bridge
  internal:
    name: sentinel-internal
    driver: bridge
    internal: true
  data:
    name: sentinel-data
    driver: bridge
    internal: true
