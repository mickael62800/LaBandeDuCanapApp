###############################################################################
# Phase 0 — Observabilité : configuration Prometheus minimale
#
# Scrape les API Rust (Sentinel, Nexus, Atrium) + le worker unifie Sentinel.
# Chaque cible expose `/metrics` au format texte Prometheus :
#   - API           : http://api:3000/metrics  (route Axum publique)
#   - Workers       : http://{worker-name}:9100/metrics (serveur dédié,
#                     cf. `services/workers/worker-common/src/metrics.rs`)
#
# Démarrage local :
#   docker compose --profile monitoring up -d prometheus grafana
#
# Recharger cette config sans redémarrer :
#   curl -X POST http://localhost:9090/-/reload
###############################################################################

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'sentinel-local'

# AUTHENTIFICATION DES SCRAPES
#
# Les quatre API exigent desormais un Bearer sur `/metrics` : l'endpoint expose
# les noms de routes, les compteurs d'appels et les latences — la carte de
# l'installation. Le port n'est joignable que depuis le reseau interne, mais
# c'est une propriete du RESEAU, pas de l'API.
#
# Le jeton n'est pas ecrit ici : Prometheus n'interpole pas les variables
# d'environnement dans sa configuration, et un secret en clair dans le depot
# serait pire que l'endpoint ouvert. Il est ecrit au demarrage par le service
# `prometheus-token-init` dans un volume, et lu par `credentials_file`.
#
# Les workers (`sentinel-worker:9100`) n'ont pas de jeton : leur serveur de
# metriques vient de `platform-common-worker` et n'en gere pas. Ils exposent des
# compteurs de jobs, pas la surface HTTP publique. C'est un reste assume.
scrape_configs:
  # ── API ──
  - job_name: 'sentinel-api'
    metrics_path: '/metrics'
    authorization:
      type: Bearer
      credentials_file: /secrets/metrics-token
    static_configs:
      - targets: ['api:3000']
        labels:
          service: 'api'
          component: 'backend'

  # ── API Nexus (plateforme jeux) ──
  # Memes noms de metriques que sentinel-api (http_requests_total,
  # http_request_duration_seconds, tokio_*) : les dashboards Grafana se
  # reutilisent tels quels en filtrant sur le label `service`.
  - job_name: 'nexus-api'
    metrics_path: '/metrics'
    authorization:
      type: Bearer
      credentials_file: /secrets/metrics-token
    static_configs:
      - targets: ['nexus-api:3100']
        labels:
          service: 'nexus-api'
          component: 'backend'

  # ── API Atrium (accueil IA) ──
  # Meme jeu de metriques que les deux autres API (`http_requests_total`,
  # `http_request_duration_seconds`, `tokio_*`), filtrables sur `service`.
  # Le service tourne derriere le profil Docker `atrium` : quand il est arrete,
  # la cible remonte `down`, ce qui est l'information juste.
  - job_name: 'atrium-api'
    metrics_path: '/metrics'
    authorization:
      type: Bearer
      credentials_file: /secrets/metrics-token
    static_configs:
      - targets: ['atrium-api:8090']
        labels:
          service: 'atrium-api'
          component: 'backend'

  # ── API Exploitation (machine hote) ──
  #
  # Cible AJOUTEE le 13/08 : `ops-api` exposait `/metrics` et lisait deja
  # `OPS_METRICS_TOKEN`, mais aucun job ne la scrapait — le jeton protegeait
  # donc un endpoint que personne ne lisait, et les metriques de l'exploitation
  # n'existaient nulle part. Quatre API, quatre cibles.
  - job_name: 'ops-api'
    metrics_path: '/metrics'
    authorization:
      type: Bearer
      credentials_file: /secrets/metrics-token
    static_configs:
      - targets: ['ops-api:3200']
        labels:
          service: 'ops-api'
          component: 'backend'

  # ── Worker unifie ──
  # Les workers par domaine ont ete fusionnes dans le binaire `sentinel-worker`
  # (meta-scheduler, cf. sentinel-worker/src/scheduler.rs). Une seule cible
  # remplace donc les 11 anciennes, qui ne resolvaient plus.
  - job_name: 'sentinel-workers'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'sentinel-worker:9100'
        labels:
          component: 'worker'
    relabel_configs:
      # Extrait le nom du service depuis l'instance pour avoir un label propre
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: service
        replacement: '$1'

  # ── Postgres exporter (à ajouter en Phase 2 si besoin) ──
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # ── Prometheus self-scrape (utile pour suivre la santé du scraper) ──
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
