[package]
name = "nexus-api"
version = "0.1.0"
edition = "2021"
description = "API HTTP (axum) de la plateforme jeux Nexus — adapters + bootstrap autour de nexus-core"

[dependencies]
nexus-core = { path = "../nexus-core" }
nexus-proto = { path = "../nexus-proto" }
tonic = { workspace = true }
platform-common-api = { workspace = true }
axum = { version = "0.8", features = ["multipart"] }
tokio = { workspace = true }
tokio-stream = "0.1"
# Pile de middlewares HTTP — memes features que sentinel-api, pour que les
# deux APIs offrent les memes garanties (CORS, compression, limite de corps,
# request-id, trace). Nexus pilote Docker : il ne peut pas etre moins protege.
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "request-id", "propagate-header", "set-header", "compression-zstd", "compression-gzip"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-stream = "0.3"
async-trait = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
dotenvy = { workspace = true }
redis = { workspace = true }
futures-util = { workspace = true }
# NI `bollard` NI `tar` ici : ce crate ne parle plus au socket Docker, il
# appelle `docker-agent` en HTTP (adapters/outbound/game_runtime/http_runtime.rs).
# Les rajouter reintroduirait un second mapping bollard -> domaine, et surtout
# la tentation de remonter /var/run/docker.sock dans ce processus.
reqwest = { workspace = true, features = ["json", "multipart"] }
base64 = "0.23.1"

[dev-dependencies]
# `oneshot` sur un Router pour tester un middleware sans ouvrir de socket.
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
