[package]
name = "ops-api"
version.workspace = true
edition.workspace = true
description = "API d'exploitation de la machine hote (sondes, Docker, logs techniques, securite hote)"

[[bin]]
name = "ops-api"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
platform-common-api = { workspace = true }
ops-core = { workspace = true }
ops-adapters = { workspace = true }
# Client du docker-agent + webhook Discord des alertes.
reqwest = { workspace = true }
# Deduplication des alertes (cle a TTL = cooldown de la regle).
redis = { workspace = true }
# Lecture de l'expiration du certificat TLS de l'hote.
x509-parser = "0.16"
uuid = { workspace = true, features = ["v4"] }

[lints]
workspace = true
