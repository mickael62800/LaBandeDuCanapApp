[package]
name = "platform-common-api"
version = "0.1.0"
edition = "2021"
description = "Middlewares HTTP partages par sentinel-api et nexus-api (rate limit, metriques, en-tetes)"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { workspace = true }
tower-http = { version = "0.6", features = ["cors", "set-header"] }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
platform-common = { path = "../platform-common" }
# Client de l'API d'identite (auth_client).
reqwest = { workspace = true }
sqlx = { workspace = true }

# Observabilite
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
tokio-metrics = { version = "0.4", default-features = false, features = ["rt"] }
# Comparaison constant-time des jetons (anti timing attack).
subtle = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
