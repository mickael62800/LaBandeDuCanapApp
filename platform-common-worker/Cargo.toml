[package]
name = "platform-common-worker"
version = "0.1.0"
edition = "2021"
description = "Common infrastructure for worker crates in the DiscordSentinel workspace."

[dependencies]
sentinel-core = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sentinel-proto = { workspace = true }
tonic = { workspace = true }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
tokio-metrics = { version = "0.4", default-features = false, features = ["rt"] }
axum = "0.8"
