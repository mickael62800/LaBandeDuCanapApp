[package]
name = "platform-common-worker"
version = "0.1.0"
edition = "2021"
description = "Common infrastructure for worker crates in the DiscordSentinel workspace."

[dependencies]
# Aucune dependance de plateforme ici : ce crate est le socle des TROIS
# workers. `sentinel-core` et `sentinel-proto` y figuraient pour deux parsers
# et un helper TLS, ce qui faisait compiler le domaine de Sentinel a
# nexus-worker et atrium-worker. Les parsers sont passes dans
# `platform-common::config_flags`, le helper TLS dans `sentinel-worker/grpc.rs`
# (son unique appelant).
platform-common = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
tokio-metrics = { version = "0.4", default-features = false, features = ["rt"] }
axum = "0.8"
