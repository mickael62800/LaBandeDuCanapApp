[package]
name = "platform-gateway"
version = "0.1.0"
edition = "2021"
description = "Gateway WebSocket de la plateforme — relay temps reel entre les APIs et les clients"

[dependencies]
# Web / WebSocket
axum = { version = "0.8", features = ["ws"] }
tokio = { workspace = true }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "propagate-header"] }

# Redis Streams (Phase 5B : XREAD live tail remplace pub/sub)
redis = { workspace = true }

# HTTP Client
reqwest = { workspace = true }

# Comparaison constant-time pour le token WebSocket (anti-timing-attack)
subtle = "2"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Utils
dotenvy = { workspace = true }

# Phase 1 — Quick wins : jemalloc en allocateur global (Linux/macOS uniquement,
# pas supporte sur MSVC Windows). Gain typique : -15 % RAM residente sur les
# processus long-running grace a une meilleure gestion de la fragmentation.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"
