model:
  name: "text-sentinel"
  backbone: "camembert-base"  # Modele francais specialise (138Go de texte FR)
  num_classes: 5
  max_length: 128  # 99% des messages Discord < 50 mots

training:
  epochs: 20
  batch_size: 64
  learning_rate: 0.00003  # 3e-5, optimal pour fine-tuning transformers
  weight_decay: 0.01
  scheduler: "linear_warmup"
  warmup_ratio: 0.1
  early_stopping_patience: 3
  label_smoothing: 0.1  # Regularisation contre le bruit dans les labels

data:
  train_split: 0.80
  val_split: 0.10
  test_split: 0.10
  num_workers: 4

classes:
  0: "neutral"
  1: "anger"       # Colere
  2: "rage"         # Rage / haine
  3: "threat"       # Menace
  4: "harassment"   # Harcelement

export:
  format: "onnx"
  opset_version: 17
  dynamic_axes: true
  simplify: true
  output_path: "../exports/text_sentinel.onnx"
