model:
  name: "vision-sentinel"
  backbone: "efficientnet_v2_s"  # Leger et performant pour export ONNX
  num_classes: 3                  # nsfw, illicit, safe
  input_size: 224
  pretrained: true

training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler: "cosine"
  warmup_epochs: 5
  early_stopping_patience: 10

data:
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  augmentation: true
  num_workers: 4

classes:
  0: "safe"
  1: "nsfw"
  2: "illicit"

export:
  format: "onnx"
  opset_version: 17
  dynamic_axes: true           # Batch size dynamique
  simplify: true
  output_path: "../exports/vision_sentinel.onnx"
