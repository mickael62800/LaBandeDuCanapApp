syntax = "proto3";

package sentinel.ai_dataset.v1;

import "common.proto";

// Collecte des messages texte pour l'entrainement de modeles IA.
// Remplace `POST /api/ai-dataset/collect` (cf. ai-dataset-bot).
//
// Appele sur CHAQUE message non-bot des guilds ou le module `ai-dataset-bot`
// est actif : c'est le chemin le plus chaud du bot.
//
// Client-streaming : le bot maintient UNE stream longue duree et y pousse
// chaque message (via un canal interne + try_send non bloquant). On amortit
// ainsi l'ouverture d'appel par message ; le serveur insere au fil de l'eau.
// La stream est reetablie automatiquement par le bot en cas de rupture
// reseau (best-effort, perte d'un message tolere).
service AiDatasetService {
  // Insere chaque message recu dans `ai_dataset_messages` au fil du stream.
  // Renvoie Empty a la fermeture de la stream (arret du bot).
  rpc CollectMessages(stream CollectMessageRequest) returns (sentinel.common.v1.Empty);
}

message CollectMessageRequest {
  string guild_id = 1;
  string channel_id = 2;
  // Nom du salon resolu best-effort cote bot ; absent si non resolvable.
  optional string channel_name = 3;
  string user_id = 4;
  string content = 5;
}
