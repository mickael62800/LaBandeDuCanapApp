syntax = "proto3";

package sentinel.audit.v1;

// Journal d'audit du serveur : les 6 operations dont le bot a besoin.
//
// Le dashboard web garde ses routes HTTP : il filtre par plage de dates, par
// nature d'evenement multiple, pagine et compte — rien de tout cela n'est
// utilise par le bot, qui ne fait qu'une recherche simple et l'affiche.
service AuditService {
  // Recherche simple (`/audit search`).
  rpc SearchAuditLogs(SearchAuditLogsRequest) returns (SearchAuditLogsResponse);
  // Ingestion d'un evenement observe par le bot.
  rpc CreateAuditLog(CreateAuditLogRequest) returns (CreateAuditLogResponse);
  // Identifiants des membres sous surveillance (amorce le tracker au boot).
  rpc ListWatchedUserIds(ListWatchedUserIdsRequest) returns (ListWatchedUserIdsResponse);
  // Trace d'activite d'un membre surveille. Best-effort cote appelant.
  rpc LogUserActivity(LogUserActivityRequest) returns (LogUserActivityResponse);
  // Rapport hebdomadaire agrege server-side.
  rpc GetWeeklyReport(GetWeeklyReportRequest) returns (WeeklyReport);
  // Enregistre un evenement de moderation et decide s'il constitue une
  // anomalie. La DECISION est server-side : le bot n'affiche que l'alerte.
  rpc DetectModerationAnomaly(DetectAnomalyRequest) returns (DetectAnomalyResponse);
  // Retrouve le contenu d'un message a partir de son id Discord (fallback DB du
  // bot a l'edition, quand le cache RAM serenity n'a plus l'ancien contenu).
  rpc GetActivityByMessage(GetActivityByMessageRequest) returns (GetActivityByMessageResponse);
  // Historise un changement de pseudo (le serveur decide event_type + details).
  rpc RecordNameHistory(RecordNameHistoryRequest) returns (RecordNameHistoryResponse);
}

message RecordNameHistoryRequest {
  string guild_id = 1;
  string user_id = 2;
  string old_name = 3;
  string new_name = 4;
}

message RecordNameHistoryResponse {}

message GetActivityByMessageRequest {
  string guild_id = 1;
  string message_id = 2;
}

message GetActivityByMessageResponse {
  // Absent si aucune activite trouvee, ou si l'activite n'a pas de contenu.
  optional string content = 1;
}

// Entree du journal, reduite aux champs que le bot affiche reellement.
//
// Le HTTP renvoyait un JSON libre dont le bot ne lisait que ces trois champs ;
// les nommer ici rend le contrat verifiable au lieu d'implicite.
message AuditLogEntry {
  string event_type = 1;
  optional string actor_name = 2;
  optional string target_name = 3;
}

message SearchAuditLogsRequest {
  string guild_id = 1;
  optional string target_id = 2;
  optional string event_type = 3;
  uint32 limit = 4;
}

message SearchAuditLogsResponse {
  repeated AuditLogEntry entries = 1;
}

message CreateAuditLogRequest {
  string guild_id = 1;
  string event_type = 2;
  optional string actor_id = 3;
  optional string actor_name = 4;
  optional string target_id = 5;
  optional string target_name = 6;
  optional string channel_id = 7;
  optional string channel_name = 8;
  // Charge libre propre au type d'evenement, serialisee en JSON : sa forme
  // varie selon `event_type` et n'a pas de schema fixe.
  string details_json = 9;
}

message CreateAuditLogResponse {
  string id = 1;
}

message ListWatchedUserIdsRequest {
  // Obligatoire : sans lui la liste serait globale et echapperait au scope
  // par serveur (durcissement IDOR cote API).
  string guild_id = 1;
  uint32 limit = 2;
}

message ListWatchedUserIdsResponse {
  repeated string user_ids = 1;
}

message LogUserActivityRequest {
  string guild_id = 1;
  string user_id = 2;
  string event_type = 3;
  optional string channel_id = 4;
  optional string channel_name = 5;
  optional string content = 6;
  string metadata_json = 7;
}

message LogUserActivityResponse {}

message GetWeeklyReportRequest {
  string guild_id = 1;
}

message WeeklyReport {
  uint64 member_joins = 1;
  uint64 member_leaves = 2;
  uint64 bans = 3;
  uint64 messages_deleted = 4;
  uint64 messages_edited = 5;
  uint64 role_changes = 6;
  uint64 channel_changes = 7;
  uint64 voice_events = 8;
  uint64 anomalies = 9;
}

message DetectAnomalyRequest {
  string guild_id = 1;
  // "ban" | "kick" | "delete" | "role_change"
  string category = 2;
  // > 1 pour une purge en masse.
  uint64 increment = 3;
  uint64 window_secs = 4;
  uint64 mass_ban = 5;
  uint64 mass_delete = 6;
  uint64 mass_role_change = 7;
}

message AnomalyAlert {
  string anomaly_type = 1;
  uint64 count = 2;
  uint64 window_secs = 3;
}

message DetectAnomalyResponse {
  // Absent = aucun seuil franchi, cas de tres loin le plus frequent.
  optional AnomalyAlert alert = 1;
}
