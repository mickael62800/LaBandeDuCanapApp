syntax = "proto3";

package sentinel.automod.v1;

// Service automod : analyse de messages en temps reel.
//
// **Hot path le plus chaud du projet** — appele a chaque message Discord
// par automod-bot. Le gain perf gRPC est ici maximal : protobuf binaire
// au lieu de JSON, multiplexage HTTP/2, contrat type strict.
service AutomodService {
  rpc AnalyzeMessage(AnalyzeMessageRequest) returns (AnalyzeMessageResponse);
  // Verdict d'auto-protection face a un flood. Le bot detecte le flood
  // (tracker rate en memoire) puis demande la decision ici : la regle
  // (seuil severe, toggle) vit cote serveur.
  rpc EvaluateFlood(EvaluateFloodRequest) returns (EvaluateFloodResponse);
  // Verdict sur des pieces jointes suspectes. Le bot envoie les noms de
  // fichiers ; la regle (extensions dangereuses + config) vit cote serveur.
  rpc EvaluateAttachments(EvaluateAttachmentsRequest) returns (EvaluateAttachmentsResponse);
  // Score de confiance a afficher pour une detection de CAPS (majuscules).
  // La detection reste locale (rate/forme) mais le SCORE affiche est fabrique
  // cote serveur : le bot ne l'invente plus (avant : 0.8 code en dur).
  rpc EvaluateCaps(EvaluateCapsRequest) returns (EvaluateCapsResponse);

  // ── Slowmode adaptatif : persistance de l'ensemble actif ──
  //
  // Le tracker du bot est en memoire. Sans ce miroir cote API, un redemarrage
  // laisserait les salons bloques en slowmode a vie : personne ne saurait
  // plus lesquels doivent etre relaches.
  rpc MarkAdaptiveSlowmode(AdaptiveSlowmodeChannel) returns (AdaptiveSlowmodeAck);
  rpc UnmarkAdaptiveSlowmode(AdaptiveSlowmodeChannel) returns (AdaptiveSlowmodeAck);
  rpc ListAdaptiveSlowmode(ListAdaptiveSlowmodeRequest) returns (ListAdaptiveSlowmodeResponse);
}

message EvaluateCapsRequest {
  string guild_id = 1;
}

message EvaluateCapsResponse {
  // Score de confiance affiche sur la carte / l'embed (fabrique cote serveur).
  double score = 1;
}

message EvaluateAttachmentsRequest {
  string guild_id = 1;
  repeated string filenames = 2;
}

message EvaluateAttachmentsResponse {
  bool suspicious = 1;
  Action action = 2;
  string reason = 3;
  double score = 4;
  string filename = 5;
}

message EvaluateFloodRequest {
  string guild_id = 1;
  string user_id = 2;
  string channel_id = 3;
  int32 flood_count = 4;
}

message EvaluateFloodResponse {
  bool severe = 1;
  int64 mute_duration_secs = 2;
  // Score de confiance affiche sur la carte (fabrique cote serveur).
  double score = 3;
}

message DetectionFlags {
  bool spam = 1;
  // Insulte CIBLEE uniquement.
  bool insult = 2;
  bool link = 3;
  bool phishing = 4;
  // Juron d'exclamation, sans insulte ciblee.
  //
  // Numero 5, jamais reutilise : un bot d'une version anterieure omet
  // simplement le champ, que proto3 lit alors comme `false`. Aucune rupture
  // pendant un deploiement ou bot et API ne sont pas de la meme version.
  bool profanity = 5;
}

message ContextMessage {
  string username = 1;
  string content = 2;
}

message AnalyzeMessageRequest {
  string guild_id = 1;
  string channel_id = 2;
  string user_id = 3;
  string username = 4;
  string content = 5;
  DetectionFlags flags = 6;
  string message_id = 7;
  // RFC3339
  string timestamp = 8;
  // Messages precedents pour l'analyse de sentiment.
  repeated ContextMessage context_messages = 9;
}

// Action a appliquer cote bot. Identique a `Action` du domain.
enum Action {
  ACTION_NONE = 0;
  ACTION_WARN = 1;
  ACTION_DELETE = 2;
  ACTION_MUTE = 3;
  ACTION_BAN = 4;
  ACTION_KICK = 5;
}

// Decision de routage calculee COTE SERVEUR (l'API connait la config guild).
// Le bot se contente d'executer : plus de logique de routage dupliquee.
enum Routing {
  // Ne rien faire automatiquement (ex. human_only sans salon de review).
  ROUTING_NONE = 0;
  // Poster une carte de review/vote dans le salon de logs.
  ROUTING_CARD = 1;
  // Appliquer directement l'action (mode auto, hors human_only).
  ROUTING_AUTO = 2;
}

message AnalyzeMessageResponse {
  Action action = 1;
  string reason = 2;
  double score = 3;
  optional uint64 duration = 4;

  // ── Decision de routage (calculee cote serveur) ──
  // Que doit faire le bot de cette detection.
  Routing route = 5;
  // Cas severe (phishing / invitation Discord) : le bot applique une
  // protection reversible immediate (mute + suppression) en plus de la carte.
  bool severe = 6;
  // Lien non autorise HORS image : suppression automatique immediate.
  bool auto_delete_link = 7;
  // Execute l'action en plus d'une eventuelle carte de review.
  bool auto_action = 8;
}

// ── Slowmode adaptatif ──

message AdaptiveSlowmodeChannel {
  // Vide au retrait : la cle de suppression est le salon, unique en base.
  string guild_id = 1;
  string channel_id = 2;
}

message AdaptiveSlowmodeAck {}

message ListAdaptiveSlowmodeRequest {}

message ListAdaptiveSlowmodeResponse {
  repeated AdaptiveSlowmodeChannel channels = 1;
}
