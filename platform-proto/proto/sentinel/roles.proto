syntax = "proto3";

package sentinel.roles.v1;

// Service partage par community-bot et roles-bot. Couvre les role-panels
// (panneaux de selection de roles via reactions/boutons) et les auto-roles
// attribues a l'arrivee.
//
// Les sponsorships, temp-roles et sync_discord_roles restent en HTTP : ils
// utilisent des repos directs cote API et seront migres dans une iteration
// ulterieure.
service RolePanelsService {
  rpc GetPanel(GetPanelRequest) returns (GetPanelResponse);
  rpc GetPanelByMessage(GetPanelByMessageRequest) returns (GetPanelResponse);
  rpc ListPanels(ListPanelsRequest) returns (RolePanelList);
  rpc SetMessageId(SetMessageIdRequest) returns (Empty);
  rpc ListAutoRoles(ListAutoRolesRequest) returns (AutoRoleList);
  // Phase 7A.opt F.5 — sync batch des roles Discord vers l'API.
  rpc SyncDiscordRoles(SyncDiscordRolesRequest) returns (SyncDiscordRolesResponse);
}

message SyncDiscordRole {
  string id = 1;
  string name = 2;
  int32 color = 3;
  int32 position = 4;
  // Permissions en string car les bitfields Discord depassent i53 (safety JS).
  string permissions = 5;
  bool mentionable = 6;
  bool managed = 7;
  optional string icon = 8;
  int32 member_count = 9;
}

message SyncDiscordRolesRequest {
  string guild_id = 1;
  repeated SyncDiscordRole roles = 2;
}

message SyncDiscordRolesResponse {
  uint64 synced = 1;
}

message Empty {}

message GetPanelRequest {
  string panel_id = 1;
}

message GetPanelByMessageRequest {
  string message_id = 1;
}

// `panel` est absent si le panel n'existe pas (au lieu de NotFound).
message GetPanelResponse {
  optional RolePanelDetail panel = 1;
}

message ListPanelsRequest {
  string guild_id = 1;
}

message SetMessageIdRequest {
  string panel_id = 1;
  string message_id = 2;
}

message ListAutoRolesRequest {
  string guild_id = 1;
}

message RolePanel {
  string id = 1;
  string guild_id = 2;
  string channel_id = 3;
  optional string message_id = 4;
  string title = 5;
  string description = 6;
  string mode = 7;
  optional int32 max_roles = 8;
  bool enabled = 9;
}

message RolePanelEntry {
  string id = 1;
  string role_id = 2;
  string role_name = 3;
  optional string emoji = 4;
  string label = 5;
  string style = 6;
  int32 position = 7;
}

message RolePanelDetail {
  RolePanel panel = 1;
  repeated RolePanelEntry entries = 2;
}

message RolePanelList {
  repeated RolePanel panels = 1;
}

message AutoRole {
  string role_id = 1;
  string role_name = 2;
  int32 delay_secs = 3;
  bool enabled = 4;
}

message AutoRoleList {
  repeated AutoRole roles = 1;
}
