syntax = "proto3";

package sentinel.security.v1;

// Service security : reporting d'evenements de securite + listing.
// Wrappe `ManageSecurityUseCase`.
service SecurityService {
  rpc ReportEvent(ReportEventRequest) returns (SecurityEvent);
  rpc ListEvents(ListEventsRequest) returns (SecurityEventList);

  // Le bot envoie le nouveau membre + les joins recents, l'API decide
  // de tout (raid, compte suspect, alt, quarantine, captcha, lockdown).
  rpc AnalyzeNewMember(AnalyzeNewMemberRequest) returns (SecurityDecision);
}

message ReportEventRequest {
  string guild_id = 1;
  string event_type = 2;
  // "low" | "medium" | "high" | "critical"
  string severity = 3;
  string description = 4;
  repeated string user_ids = 5;
}

message ListEventsRequest {
  // Si absent, retourne les events de toutes les guilds (admin).
  optional string guild_id = 1;
}

message SecurityEvent {
  string id = 1;
  string guild_id = 2;
  string event_type = 3;
  string severity = 4;
  string description = 5;
  repeated string user_ids = 6;
  // RFC3339
  string created_at = 7;
}

message SecurityEventList {
  repeated SecurityEvent events = 1;
}

// ── Analyse nouveau membre ──

message RecentJoinEntry {
  string username = 1;
  bool has_avatar = 2;
  int64 account_created_timestamp = 3;
}

message AnalyzeNewMemberRequest {
  string guild_id = 1;
  string user_id = 2;
  string username = 3;
  bool has_avatar = 4;
  int64 account_created_timestamp = 5;
  bool is_bot = 6;
  // Joins recents dans la fenetre (buffer temporel du bot).
  repeated RecentJoinEntry recent_joins = 7;
  // Flood de vitesse detecte cote bot (RaidDetector local) : force une
  // reponse guild-wide en mode auto/hybrid (raid massif).
  bool is_velocity_raid = 8;
}

message SecurityDecision {
  bool is_raid = 1;
  uint32 raid_score = 2;
  bool is_suspicious_account = 3;
  bool is_alt_account = 4;
  string alt_similar_to = 5;
  // Actions a executer par le bot.
  bool quarantine = 6;
  bool send_captcha = 7;
  bool activate_lockdown = 8;
  uint32 slowmode_secs = 9;
  // Evenement auto-reporte si non-vide.
  string event_type = 10;
  string event_description = 11;
  // true => la reponse guild-wide (lockdown/slowmode/verification) doit etre
  // suggeree au staff au lieu d'etre appliquee (mode suggest / hybrid sous
  // le seuil). Quarantaine + captcha restent toujours auto.
  bool suggest_only = 12;
}
