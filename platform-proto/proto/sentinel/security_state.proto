syntax = "proto3";

package sentinel.security_state.v1;

// Service security_state : miroir de persistance de l'etat de securite actif
// (quarantaines, slowmode, lockdown). Le bot detecte/agit en memoire ; l'API
// est la source de verite durable qui survit aux redemarrages du bot.
//
// Distinct de `SecurityService` (package sentinel.security.v1) qui wrappe le
// domaine AUDIT (report d'evenements + analyse de nouveau membre). Ici on
// wrappe les use cases du domaine SYSTEM : `ManageQuarantineUseCase`,
// `ManageSlowmodeUseCase`, `ManageLockdownUseCase`.
service SecurityStateService {
  // Quarantaine : enregistre (UPSERT idempotent, reset le timer) et leve.
  rpc MarkQuarantine(MarkQuarantineRequest) returns (MarkQuarantineAck);
  rpc LiftQuarantine(LiftQuarantineRequest) returns (SecurityStateAck);
  // Rehydratation au demarrage du bot : liste les quarantaines encore actives.
  rpc ListActiveQuarantines(ListActiveQuarantinesRequest) returns (ActiveQuarantineList);
  // Lecture seule du reglage de la guilde, sans rien poser ni reinitialiser.
  // Sert au bot quand il doit reparler du delai a quelqu'un deja en attente :
  // reutiliser MarkQuarantine remettrait son compte a rebours a zero, et un
  // clic suffirait alors a rester indefiniment.
  rpc GetQuarantineSettings(GetQuarantineSettingsRequest) returns (MarkQuarantineAck);

  // Slowmode adaptatif de securite : enregistre l'etat actif (UPSERT idempotent).
  rpc MarkSlowmode(MarkSlowmodeRequest) returns (SecurityStateAck);

  // Lockdown de securite : enregistre l'etat actif (UPSERT idempotent).
  rpc MarkLockdown(MarkLockdownRequest) returns (SecurityStateAck);
}

message SecurityStateAck {}

message MarkQuarantineRequest {
  string guild_id = 1;
  string user_id = 2;
  // Delai avant expulsion (secondes). 0 ou absent : le serveur applique le
  // reglage de la guilde, ce qui est le cas normal. Le bot n'a pas a connaitre
  // ce delai — il le decouvre dans la reponse, et l'annonce au membre.
  //
  // Une valeur non nulle reste possible pour un appel deliberement explicite
  // (outil d'administration), et court-circuite alors le reglage.
  int64 timeout_secs = 3;
}

message MarkQuarantineAck {
  // Delai effectivement retenu, en secondes. C'est ce que le message prive
  // annonce au membre : l'ecrire en dur cote bot le ferait mentir des que le
  // reglage change.
  int64 timeout_secs = 1;
  // Rappel programme avant l'expulsion, en secondes avant l'echeance. 0 : pas
  // de rappel.
  int64 reminder_secs = 2;
  // Faux si la guilde a desactive l'expulsion automatique : le membre reste en
  // attente d'une decision humaine, et le message ne doit pas menacer d'une
  // expulsion qui ne viendra pas.
  bool kick_enabled = 3;
}

message GetQuarantineSettingsRequest {
  string guild_id = 1;
}

message LiftQuarantineRequest {
  string guild_id = 1;
  string user_id = 2;
}

message ListActiveQuarantinesRequest {}

message ActiveQuarantineEntry {
  string guild_id = 1;
  string user_id = 2;
}

message ActiveQuarantineList {
  repeated ActiveQuarantineEntry entries = 1;
}

message MarkSlowmodeRequest {
  string guild_id = 1;
  // JSON array : [{channel_id, rate}, ...] — rates d'origine a restaurer.
  string previous_states_json = 2;
  int64 duration_secs = 3;
  // Rate impose par le raid (pour ne restaurer que si le salon le porte encore).
  int32 imposed_rate = 4;
}

message MarkLockdownRequest {
  string guild_id = 1;
  // JSON array decrivant les overwrites originaux par salon.
  string saved_states_json = 2;
  int64 duration_secs = 3;
}
