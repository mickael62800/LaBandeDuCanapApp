syntax = "proto3";

package sentinel.voice.v1;

// Service voice channels : creation/gestion des salons vocaux dynamiques.
// Wrappe `ManageVoiceChannelsUseCase` cote API. Themes et invite-links
// restent en HTTP pour cette iteration (pas appeles depuis api_client.rs
// du bot).
service VoiceChannelsService {
  rpc ListChannels(ListChannelsRequest) returns (VoiceChannelList);
  rpc CreateChannel(CreateChannelRequest) returns (VoiceChannel);
  rpc DeleteChannel(DeleteChannelRequest) returns (Empty);
  rpc UpdateChannel(UpdateChannelRequest) returns (Empty);
  rpc GetChannel(GetChannelRequest) returns (GetChannelResponse);
  rpc TransferOwnership(TransferOwnershipRequest) returns (Empty);
  rpc AddCoAdmin(AddCoAdminRequest) returns (Empty);
  rpc AddToWhitelist(AddToWhitelistRequest) returns (Empty);
  rpc BanFromChannel(BanFromChannelRequest) returns (Empty);
  // Verifie si un user est banni pour le proprietaire du salon (join-time check).
  rpc IsBanned(IsBannedRequest) returns (IsBannedResponse);
  // Bans memorises pour un proprietaire : re-application a la recreation.
  rpc ListOwnerBans(ListOwnerBansRequest) returns (OwnerBanList);
  rpc GetVoiceConfig(GetVoiceConfigRequest) returns (VoiceConfig);
  rpc ListThemes(ListThemesRequest) returns (ThemeList);
  // Presets par proprietaire (sauvegarde des parametres) + lecture whitelist.
  rpc SavePreset(SavePresetRequest) returns (Empty);
  rpc GetPreset(GetPresetRequest) returns (GetPresetResponse);
  rpc GetWhitelist(GetWhitelistRequest) returns (WhitelistList);
}

message Empty {}

message ListChannelsRequest {
  string guild_id = 1;
}

message DeleteChannelRequest {
  string channel_id = 1;
}

message GetChannelRequest {
  string channel_id = 1;
}

// `channel` absent si introuvable (parite avec HTTP 404).
message GetChannelResponse {
  optional VoiceChannel channel = 1;
  repeated CoAdmin co_admins = 2;
}

message CoAdmin {
  string user_id = 1;
  string user_name = 2;
}

message CreateChannelRequest {
  string guild_id = 1;
  string owner_id = 2;
  string owner_name = 3;
  string channel_id = 4;
  optional string text_channel_id = 5;
  optional string members_channel_id = 6;
  optional string queue_channel_id = 7;
  optional string category_id = 8;
  string channel_name = 9;
  string kind = 10;
  string visibility = 11;
  bool queue_enabled = 12;
}

message UpdateChannelRequest {
  string channel_id = 1;
  optional string visibility = 2;
  optional bool locked = 3;
  optional bool queue_enabled = 4;
  optional string name = 5;
  optional string status = 6;
  // member_limit : tri-state via wrapper. Absent = pas de changement,
  // present avec valeur = set, present sans valeur = clear.
  optional MemberLimitUpdate member_limit = 7;
  optional QueueChannelUpdate queue_channel_id = 8;
}

message MemberLimitUpdate {
  optional int32 value = 1;
}

message QueueChannelUpdate {
  optional string value = 1;
}

message TransferOwnershipRequest {
  string channel_id = 1;
  string new_owner_id = 2;
  string new_owner_name = 3;
}

message AddCoAdminRequest {
  string channel_id = 1;
  string user_id = 2;
  string user_name = 3;
}

message AddToWhitelistRequest {
  string guild_id = 1;
  string owner_id = 2;
  string target_id = 3;
  string target_name = 4;
}

message BanFromChannelRequest {
  string channel_id = 1;
  string user_id = 2;
  string user_name = 3;
  string banned_by = 4;
  optional string reason = 5;
  optional int64 duration_secs = 6;
}

message IsBannedRequest {
  string channel_id = 1;
  string user_id = 2;
}

message IsBannedResponse {
  bool banned = 1;
}

message ListOwnerBansRequest {
  string guild_id = 1;
  string owner_id = 2;
}

message OwnerBan {
  string user_id = 1;
  string user_name = 2;
  optional string reason = 3;
  // RFC3339, absent si ban permanent.
  optional string expires_at = 4;
}

message OwnerBanList {
  repeated OwnerBan bans = 1;
}

message VoiceChannel {
  string id = 1;
  string guild_id = 2;
  string owner_id = 3;
  string owner_name = 4;
  string channel_id = 5;
  optional string text_channel_id = 6;
  optional string members_channel_id = 7;
  optional string queue_channel_id = 8;
  optional string category_id = 9;
  string channel_name = 10;
  string kind = 11;
  string visibility = 12;
  bool queue_enabled = 13;
  bool locked = 14;
  optional int32 member_limit = 15;
  optional string status = 16;
  // RFC3339
  string created_at = 17;
}

message VoiceChannelList {
  repeated VoiceChannel channels = 1;
}

// ── Config voice-bot par guild ──

message GetVoiceConfigRequest {
  string guild_id = 1;
}

message VoiceConfig {
  uint64 creation_cooldown_secs = 1;
  uint64 flood_max_messages = 2;
  uint64 flood_time_window_secs = 3;
  uint64 empty_cleanup_delay_secs = 4;
  uint64 flood_mute_duration_secs = 5;
  uint64 vote_kick_timeout_secs = 6;
}

// ── Themes ──

message ListThemesRequest {
  string guild_id = 1;
}

message VoiceChannelTheme {
  string id = 1;
  string guild_id = 2;
  string name = 3;
  optional string emoji = 4;
  string channel_name_template = 5;
  optional int32 member_limit = 6;
  string visibility = 7;
  bool locked = 8;
  bool queue_enabled = 9;
  optional int32 bitrate = 10;
  optional int32 slowmode_secs = 11;
  bool stage_enabled = 12;
  bool is_default = 13;
  int32 sort_order = 14;
  string created_at = 15;
}

message ThemeList {
  repeated VoiceChannelTheme themes = 1;
}

// ── Presets par proprietaire + whitelist ──

message SavePresetRequest {
  string guild_id = 1;
  string owner_id = 2;
  optional string channel_name = 3;
  optional int32 member_limit = 4;
  string visibility = 5;
  bool locked = 6;
  bool queue_enabled = 7;
}

message GetPresetRequest {
  string guild_id = 1;
  string owner_id = 2;
}

message VoicePreset {
  string owner_id = 1;
  optional string channel_name = 2;
  optional int32 member_limit = 3;
  string visibility = 4;
  bool locked = 5;
  bool queue_enabled = 6;
}

// `preset` absent si aucun preset enregistre (parite avec HTTP 404).
message GetPresetResponse {
  optional VoicePreset preset = 1;
}

message GetWhitelistRequest {
  string guild_id = 1;
  string owner_id = 2;
}

message WhitelistEntry {
  string target_id = 1;
  string target_name = 2;
}

message WhitelistList {
  repeated WhitelistEntry entries = 1;
}
