syntax = "proto3";

package sentinel.welcome.v1;

// Phase 7A.opt F.4 — Welcome config en gRPC.
// Wrappe le handler HTTP sqlx direct (welcome_config table, pas de use case
// unifie cote API). Appele par welcome-bot au demarrage pour charger la
// config d'une guild.
service WelcomeService {
  rpc GetConfig(GetConfigRequest) returns (WelcomeConfig);
}

message GetConfigRequest {
  string guild_id = 1;
}

message WelcomeConfig {
  string guild_id = 1;
  bool welcome_enabled = 2;
  optional string welcome_channel_id = 3;
  string welcome_message = 4;
  string welcome_embed_color = 5;
  bool welcome_dm_enabled = 6;
  string welcome_dm_message = 7;
  bool leave_enabled = 8;
  optional string leave_channel_id = 9;
  string leave_message = 10;
  bool rules_enabled = 11;
  optional string rules_channel_id = 12;
  string rules_message = 13;
  optional string rules_role_id = 14;
  string rules_button_label = 15;
  // Verification d'age au reglement.
  bool age_check_enabled = 38;
  int32 age_minimum = 39;
  optional string unverified_role_id = 40;
  string age_modal_question = 41;
  string age_ban_message = 42;
  bool counter_enabled = 16;
  optional string counter_channel_id = 17;
  string counter_format = 18;
  bool anniversary_enabled = 19;
  optional string anniversary_channel_id = 20;
  string anniversary_message = 21;
  string rejoin_message = 22;
  // Embed enrichi — bienvenue
  string welcome_title = 23;
  string welcome_image_url = 24;
  string welcome_footer_text = 25;
  // Embed enrichi — retour (rejoin)
  string rejoin_title = 32;
  string rejoin_image_url = 33;
  string rejoin_footer_text = 34;
  // Embed enrichi — depart
  string leave_title = 26;
  string leave_image_url = 27;
  string leave_footer_text = 28;
  // Embed enrichi — anniversaire
  string anniversary_title = 29;
  string anniversary_image_url = 30;
  string anniversary_footer_text = 31;
  // Compteur de membres en vocal (canal renomme avec le nb de connectes)
  bool voice_counter_enabled = 35;
  optional string voice_counter_channel_id = 36;
  string voice_counter_format = 37;
  // Position du texte / a l'image de bienvenue ("above" | "below").
  reserved 43;
}
