[package]
name = "sentinel-bot"
version = "0.1.0"
edition = "2021"
description = "Bot Discord unifie DiscordSentinel — tous les modules en un seul processus"

[dependencies]
hmac = "0.12"
sha2 = "0.10"
sentinel-proto = { workspace = true }
sentinel-core = { workspace = true }
platform-common = { workspace = true }
prost = { workspace = true }
thiserror = { workspace = true }
serenity = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dotenvy = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dashmap = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
redis = { version = "0.27", features = ["tokio-comp"] }
futures-util = { workspace = true }
# `ReceiverStream` : expose un mpsc en client-streaming gRPC (ai-dataset).
tokio-stream = "0.1"
regex = "1"
time = "0.3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
once_cell = "1"
resvg = "0.44"
platform-common-bot = { version = "0.1.0", path = "../platform-common-bot" }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[lints]
workspace = true
