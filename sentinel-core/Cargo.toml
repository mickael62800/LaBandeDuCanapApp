[package]
name = "sentinel-core"
version = "0.1.0"
edition = "2021"
description = "Coeur hexagonal pur (domain) — sans dependance infra (pas de sqlx/axum/reqwest/redis)"

[dependencies]
chrono = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
platform-common = { path = "../platform-common" }
rand = { workspace = true }
async-trait = { workspace = true }
ndarray = { workspace = true }
image = { workspace = true }
regex = "1"
dashmap = { workspace = true }
sha2 = "0.10"

[dev-dependencies]
# `test-util` pour `#[tokio::test(start_paused = true)]` (tests time-virtualises).
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
