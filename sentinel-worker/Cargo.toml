[package]
name = "sentinel-worker"
version = "0.1.0"
edition = "2021"
description = "Worker unifie DiscordSentinel — orchestrateur de tous les jobs periodiques (cleanup, moderation, analytics, tickets, etc.) dans un seul binaire. Fusion progressive des anciens workers eclates."

[dependencies]
platform-common-worker = { path = "../platform-common-worker" }
# Coeur hexagonal partagé. Le worker n'instancie pas les adapters/use cases de
# sentinel-api (pas de dépendance croisée) : il assume du SQL ensembliste
# (scans, claims atomiques `UPDATE ... WHERE`, XADD) et importe du core les
# DÉCISIONS métier (fonctions pures et constantes, ex. tickets::sla).
sentinel-core = { workspace = true }
# Signature des events `guild_backup:*` publies sur le bus commun (le bot rejette
# un event destructif non signe). Memes versions que sentinel-api / sentinel-bot.
hmac = "0.12"
sha2 = "0.10"
tokio = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sentinel-proto = { workspace = true }
tonic = { workspace = true }
rand = { workspace = true }

# Deps inlinees depuis l'ancien worker-common (absorbe dans src/common/).
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
tokio-metrics = { version = "0.4", default-features = false, features = ["rt"] }
axum = "0.8"

# jemalloc en allocateur global (Linux/macOS uniquement).
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"


