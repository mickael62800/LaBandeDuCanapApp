# Reverse-proxy + SPA static server pour web (Vue 3 + Vite).
# - Port 80  : sert les challenges ACME (/.well-known/acme-challenge/) puis
#              redirige tout le reste vers HTTPS.
# - Port 443 : TLS + reverse-proxy /api/* -> api:3000, /ws -> gateway:3001.

# Ne pas divulguer la version de nginx dans les headers/pages d'erreur
# (ralentit le fingerprinting par les scanners).
server_tokens off;

# Buffers augmentes : exports CSV/JSON de l'API peuvent etre volumineux.
client_max_body_size 25m;

# ── Rate limiting (anti brute-force / abus) ──
# Cle = IP client. Zones separees : auth (strict) vs API (genereux, le
# dashboard fait beaucoup d'appels legitimes en parallele).
limit_req_zone $binary_remote_addr zone=rl_auth:1m  rate=30r/m;
limit_req_zone $binary_remote_addr zone=rl_api:10m  rate=30r/s;
limit_req_status 429;

# Resolver Docker DNS embarque (127.0.0.11). Indispensable pour que nginx
# re-resolve les hostnames `api` et `gateway` apres un rebuild Docker
# (sinon il garde l'ancienne IP en cache et bug en 502 a chaque deploy).
# valid=10s : duree max du cache DNS. ipv6=off : on n'utilise que IPv4
# entre containers.
resolver 127.0.0.11 valid=10s ipv6=off;

# ──────────────────────────────────────────────────────────────
# HTTP : ACME challenge + redirect 301 vers HTTPS
# ──────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;

    # Challenge HTTP-01 de certbot : doit rester accessible en HTTP sans
    # redirection (sinon LE ne peut pas valider le domaine).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Healthcheck en HTTP (pour l'orchestrateur) : 200 sans TLS.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Tout le reste -> HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ──────────────────────────────────────────────────────────────
# HTTPS : TLS + SPA + reverse-proxy
# ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Certs geres par l'entrypoint (Let's Encrypt ou self-signed fallback).
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS moderne (Mozilla "intermediate", drop TLS 1.0/1.1).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers (fichier partage : voir le piege add_header documente
    # dedans — il DOIT etre re-inclus dans toute location qui fait add_header).
    include /etc/nginx/snippets/security-headers.inc;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip : texte uniquement.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Sert les .gz pre-compresses si presents (genere a la build par
    # vite-plugin-compression2 ou equivalent). Economise du CPU nginx vs
    # compression a la volee.
    gzip_static on;

    # Assets Vite hashes : cache long (1 an, immutable).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header local -> les headers du bloc server sont perdus : re-include.
        include /etc/nginx/snippets/security-headers.inc;
        try_files $uri =404;
    }

    # Reverse-proxy API Axum. Le prefixe /api/ est conserve.
    # NB: l'usage d'une variable dans proxy_pass force nginx a re-resoudre
    # le hostname `api` au runtime via le resolver Docker (127.0.0.11) au
    # lieu de cacher l'IP au boot. Indispensable apres un rebuild de l'API.
    location /api/ {
        # Rate limit genereux : burst absorbe les rafales legitimes du
        # dashboard, au-dela -> 429.
        limit_req zone=rl_api burst=60 nodelay;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Passerelle vers la plateforme jeux Nexus ────────────────────────
    #
    # nexus-api n'est PAS publie sur l'hote : il n'est joignable que par le
    # reseau docker `internal`, et uniquement a travers ce proxy. Point
    # d'entree unique.
    #
    # Deux protections, dans cet ordre :
    #   1. auth_request -> sentinel-api resout la session Discord et verifie
    #      que l'utilisateur figure dans SUPERADMIN_USER_IDS. nexus-api n'ayant
    #      aucun controle d'acces, c'est ICI que se joue toute l'autorisation.
    #   2. l'en-tete Authorization vers nexus-api est injecte cote serveur
    #      (snippet genere au boot depuis NEXUS_API_KEY). Le navigateur ne
    #      voit jamais la cle : la mettre dans le SPA reviendrait a donner un
    #      acces admin complet a la plateforme jeux.
    #
    # Le prefixe /nexus-api/ est retire avant transmission : le SPA appelle
    # /nexus-api/api/games/... et nexus-api recoit /api/games/...
    location = /_nexus_auth {
        internal;
        set $auth_upstream http://auth-api:8096/access;
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
        # Sous-requete : pas de corps a transmettre.
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # X-Discord-Token est propage automatiquement depuis la requete
        # d'origine ; il suffit a resoudre l'identite. La decision ne depend
        # plus d'une guild (X-Guild-Id encore envoye par le SPA mais ignore).
        #
        # Jeton de service (l'en-tete Authorization ci-dessous ECRASE celui de
        # la requete d'origine, ce qui est voulu : le navigateur ne doit pas
        # pouvoir se faire passer pour un appelant interne).
        include /etc/nginx/snippets/auth-key.inc;
    }

    # Vitrine publique de la plateforme jeux : PAS d'auth_request, ces
    # endpoints sont volontairement ouverts (cf. handlers/game/public_servers).
    # La cle Nexus reste injectee cote serveur — nexus-api l'exige sur /api/*,
    # et elle ne doit jamais parvenir au navigateur.
    location /nexus-public/ {
        limit_req zone=rl_api burst=30 nodelay;

        set $nexus_pub_upstream http://nexus-api:3100;
        rewrite ^/nexus-public/(.*)$ /$1 break;
        proxy_pass $nexus_pub_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        include /etc/nginx/snippets/nexus-auth.inc;
    }

    location /nexus-api/ {
        auth_request /_nexus_auth;
        limit_req zone=rl_api burst=60 nodelay;

        # ORDRE CRITIQUE — `set` appartient au module rewrite et s'execute
        # dans l'ordre du fichier ; `rewrite ... break` interrompt les
        # directives suivantes de ce meme module. Un `set` place APRES le
        # rewrite n'est donc jamais evalue : la variable reste vide et nginx
        # repond 500 ("invalid URL prefix in """). Le `set` doit precede.
        set $nexus_upstream http://nexus-api:3100;
        rewrite ^/nexus-api/(.*)$ /$1 break;
        proxy_pass $nexus_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # Injecte `Authorization: Bearer <NEXUS_API_KEY>`. Genere au demarrage
        # par /docker-entrypoint.d/30-nexus-key.sh (fichier vide si la cle
        # n'est pas configuree -> nexus-api repondra 401, jamais 500).
        include /etc/nginx/snippets/nexus-auth.inc;
    }

    # ── Passerelle vers l'exploitation de la machine ────────────────────
    #
    # Meme montage que /nexus-api/ et /atrium-api/ : ops-api n'est pas publie
    # sur l'hote, auth_request valide la session Discord aupres de auth-api,
    # et le jeton est injecte cote serveur.
    location = /_ops_auth {
        internal;
        set $ops_auth_upstream http://auth-api:8096/access;
        proxy_pass $ops_auth_upstream;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/auth-key.inc;
    }

    location /ops-api/ {
        auth_request /_ops_auth;
        limit_req zone=rl_api burst=60 nodelay;

        # ORDRE CRITIQUE — le `set` doit preceder le `rewrite ... break`.
        set $ops_upstream http://ops-api:3200;
        rewrite ^/ops-api/(.*)$ /$1 break;
        proxy_pass $ops_upstream;
        proxy_http_version 1.1;
        # Identite de l'operateur, recuperee de la sous-requete d'autorisation
        # et transmise a ops-api, qui n'a aucun moyen de resoudre une session.
        #
        # SECURITE — ce `proxy_set_header` ECRASE tout `X-Actor-Id` envoye par
        # le navigateur. Sans lui, deux choses : l'audit d'ops-api n'avait
        # aucun auteur (« inconnu » sur toutes les lignes), et un appelant
        # pouvait attribuer ses suppressions de conteneurs a quelqu'un d'autre
        # en posant l'en-tete lui-meme. nginx relaie par defaut les en-tetes
        # clients qu'il ne surcharge pas.
        auth_request_set $ops_actor $upstream_http_x_auth_user_id;
        proxy_set_header X-Actor-Id $ops_actor;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Genereux : un prune d'images Docker peut durer plusieurs minutes.
        proxy_read_timeout 180s;

        include /etc/nginx/snippets/ops-auth.inc;
    }

    # ── Passerelle vers l'accueil IA Atrium ─────────────────────────────
    #
    # Meme montage que /nexus-api/ ci-dessus, pour la meme raison : atrium-api
    # n'est PAS publie sur l'hote, il ne repond que sur le reseau interne. Sans
    # cette passerelle, le back-office n'a aucun moyen de l'atteindre — c'est
    # pourquoi Atrium etait pilotable depuis Discord et invisible depuis le web.
    #
    #   1. auth_request -> sentinel-api resout la session Discord et verifie
    #      l'appartenance a SUPERADMIN_USER_IDS. atrium-api n'ayant aucune
    #      notion d'utilisateur, c'est le seul endroit ou l'identite est connue.
    #   2. `Authorization: Bearer <ATRIUM_API_TOKEN>` est injecte cote serveur.
    #      Le mettre dans le SPA donnerait un acces complet a l'API d'accueil.
    #
    # Le prefixe /atrium-api/ est retire avant transmission : le SPA appelle
    # /atrium-api/admin/guilds/<id>/state et atrium-api recoit
    # /admin/guilds/<id>/state.
    #
    # L'endpoint d'auth est le meme que pour les deux autres passerelles : la
    # question posee n'est pas « Atrium ? » mais « la session est-elle celle
    # d'un superadmin ? ». Location distincte malgre tout, pour que le jour ou
    # les trois droits divergent, seul le bloc concerne change.
    location = /_atrium_auth {
        internal;
        set $atrium_auth_upstream http://auth-api:8096/access;
        proxy_pass $atrium_auth_upstream;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/auth-key.inc;
    }

    location /atrium-api/ {
        auth_request /_atrium_auth;
        limit_req zone=rl_api burst=30 nodelay;

        # ORDRE CRITIQUE — voir le commentaire du bloc /nexus-api/ : le `set`
        # doit preceder le `rewrite ... break`, sinon la variable reste vide.
        set $atrium_upstream http://atrium-api:8090;
        rewrite ^/atrium-api/(.*)$ /$1 break;
        proxy_pass $atrium_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # Genere au demarrage par /docker-entrypoint.d/31-atrium-key.sh
        # (fichier vide si le jeton n'est pas configure -> atrium-api repondra
        # 401, jamais 500).
        include /etc/nginx/snippets/atrium-auth.inc;
    }

    # OAuth Discord : /auth/discord/authorize et /auth/discord/callback
    # sont des endpoints API (pas des routes SPA). Sans ce proxy, nginx
    # sert index.html via le fallback et le login Discord ne demarre jamais.
    # ATTENTION : /auth/callback (sans /discord/) est une route SPA Vue qui
    # parse le hash fragment apres OAuth -> pas de proxy dessus.
    #
    # L'amont est `auth-api` depuis l'extraction de l'identite. Les CHEMINS
    # publics sont inchanges : l'URL de callback declaree dans le portail
    # developpeur Discord reste valide, la bascule lui est invisible.
    location /auth/discord/ {
        # Anti brute-force sur le flux OAuth.
        limit_req zone=rl_auth burst=10 nodelay;
        set $auth_api_upstream http://auth-api:8096;
        proxy_pass $auth_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Session web (cookie httpOnly) : POST /auth/refresh et POST /auth/logout
    # sont des endpoints API. Sans ce proxy, ils tombent dans le fallback SPA
    # (try_files -> index.html) qui ne sert que GET/HEAD -> 405 sur POST.
    # `location =` (match exact) pour ne PAS capturer /auth/callback (route SPA).
    location = /auth/refresh {
        limit_req zone=rl_auth burst=10 nodelay;
        set $auth_api_upstream http://auth-api:8096;
        proxy_pass $auth_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /auth/logout {
        limit_req zone=rl_auth burst=10 nodelay;
        set $auth_api_upstream http://auth-api:8096;
        proxy_pass $auth_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Reverse-proxy WebSocket gateway. Upgrade headers obligatoires.
    location /ws {
        # Aucun credential dans l'URL. Le navigateur joint le cookie de
        # session HttpOnly au handshake same-origin ; le gateway doit le
        # valider avant l'upgrade.
        set $gateway_upstream http://gateway:3001;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WS peut rester ouvert longtemps : timeout relatif au heartbeat client.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ────────────────────────────────────────────────────────────
    # Anti-scanner : bloque les paths de fingerprinting connus
    # AVANT le fallback SPA, qui renverrait sinon index.html en 200.
    # 444 = nginx close connection sans response (pas de body envoye).
    # Reste loggue en access_log -> picked up par sentinel-nginx-suspicious.
    # ────────────────────────────────────────────────────────────
    # Stacks/CMS qu'on n'heberge pas : Laravel, WordPress, Joomla, Drupal,
    # phpMyAdmin, OWA, Magento, Adminer, Tomcat, ColdFusion, Citrix.
    location ~* ^/(laravel|wordpress|wp-admin|wp-login|wp-content|wp-includes|wp-json|xmlrpc\.php|phpmyadmin|pma|myadmin|adminer|joomla|drupal|magento|administrator|owa|autodiscover|ecp|aspnet_client|cgi-bin|vendor/phpunit|manager/html|_ignition|_profiler) {
        access_log /var/log/nginx/sentinel/scanners.log;
        return 444;
    }
    # Fichiers de config/secrets jamais legitimes en HTTP.
    location ~* /(\.env|\.git|\.svn|\.hg|\.aws|\.ssh|\.htaccess|\.htpasswd|\.DS_Store|composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|web\.config|wp-config\.php|database\.yml|secrets\.yml|id_rsa|server-status|server-info)$ {
        access_log /var/log/nginx/sentinel/scanners.log;
        return 444;
    }
    # Extensions exotiques jamais servies par une SPA Vite (PHP, ASP, JSP, CGI).
    location ~* \.(php|phtml|php3|php4|php5|php7|asp|aspx|jsp|cgi|pl)$ {
        access_log /var/log/nginx/sentinel/scanners.log;
        return 444;
    }

    # SPA fallback : toute route inconnue renvoie index.html pour vue-router.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html sans cache => deploiements propages immediatement.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # CRITIQUE : sans ce re-include, index.html partirait SANS CSP/HSTS
        # (add_header local annule ceux du bloc server).
        include /etc/nginx/snippets/security-headers.inc;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
